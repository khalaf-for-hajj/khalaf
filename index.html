<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>تطبيق حملة الخلف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2D6B64">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>
/* Layout concept: a pilgrim's companion — quiet white pages with Islamic lattice, a teal/gold identity lifted from the campaign files,
   one large tap target per task, and a docked action bar so the next step is always under the thumb. */
:root {
  --bg: #F3F7F6;
  --glass: rgba(243, 247, 246, .93);
  --surface: #FFFFFF;
  --surface-2: #E9F1EF;
  --ink: #17302D;
  --ink-2: #4A635F;
  --line: #D3E1DE;
  --teal: #549A92;
  --teal-deep: #2D6B64;
  --teal-soft: #DCEDEA;
  --gold: #DEBA5A;
  --gold-deep: #8A6710;
  --gold-soft: #F8EFD3;
  --crimson: #A3232B;
  --btn: #2D6B64;
  --btn-ink: #FFFFFF;
  --kaaba: #222B2A;
  --shadow: 0 1px 2px rgba(23, 48, 45, .06), 0 8px 24px rgba(23, 48, 45, .06);

  --f-naskh: "Amiri", "Noto Naskh Arabic", "Scheherazade New", "Traditional Arabic", "Geeza Pro", serif;
  --f-display: var(--f-naskh);
  --f-body: var(--f-naskh);
  --duaw: 400;
  --fs: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A19; --glass: rgba(14, 26, 25, .93); --surface: #152624; --surface-2: #1C3331;
    --ink: #E7F0EE; --ink-2: #9DB5B1; --line: #27403D;
    --teal: #6FB4AB; --teal-deep: #8CCDC4; --teal-soft: #1B3633;
    --gold: #E4C46C; --gold-deep: #E4C46C; --gold-soft: #2B2614;
    --crimson: #F0888D; --btn: #6FB4AB; --btn-ink: #0C1B19; --kaaba: #070C0B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A19; --glass: rgba(14, 26, 25, .93); --surface: #152624; --surface-2: #1C3331;
  --ink: #E7F0EE; --ink-2: #9DB5B1; --line: #27403D;
  --teal: #6FB4AB; --teal-deep: #8CCDC4; --teal-soft: #1B3633;
  --gold: #E4C46C; --gold-deep: #E4C46C; --gold-soft: #2B2614;
  --crimson: #F0888D; --btn: #6FB4AB; --btn-ink: #0C1B19; --kaaba: #070C0B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.7;
  min-height: 100%; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.in { width: 100%; max-width: 600px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { min-height: 100vh; display: flex; flex-direction: column; }
.page > main { flex: 1 0 auto; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .in { display: flex; align-items: center; gap: 12px; min-height: 80px; padding-block: 8px; }
.bar.plain .in { min-height: 56px; padding-block: 0; }
.brand { display: flex; align-items: center; flex: none; }
.brand img { height: 64px; width: auto; display: block; }
.bar-title { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; color: var(--teal-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; align-items: center; gap: 6px; flex: none; }
.ibtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--teal-deep); }
.ibtn svg { width: 20px; height: 20px; }
.ibtn.txt { font-family: var(--f-display); font-weight: 700; font-size: 1rem; }
.ibtn[disabled] { opacity: .4; }

/* ---------- home ---------- */
.hero { position: relative; overflow: hidden; text-align: center; padding-block: 28px 8px; }
.hero .pat { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--line); opacity: .95; -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 38%, #000 30%, transparent 78%); mask-image: radial-gradient(ellipse 80% 70% at 50% 38%, #000 30%, transparent 78%); pointer-events: none; }
.hero .in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.hero .logo { height: 168px; width: auto; display: block; }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; line-height: 1.35; color: var(--ink); text-wrap: balance; }
.hero .sub { color: var(--ink-2); max-width: 30ch; text-wrap: balance; font-size: 1rem; }

.resume { margin-top: 18px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--gold-soft); border: 1px solid var(--gold); width: 100%; text-align: start; }
.resume .t { flex: 1; min-width: 0; }
.resume .k { font-size: .85rem; color: var(--gold-deep); font-weight: 700; }
.resume .v { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; }
.resume .go { flex: none; padding: 10px 16px; border-radius: 12px; background: var(--btn); color: var(--btn-ink); font-weight: 700; border: 0; }

.sect { display: flex; flex-direction: column; gap: 12px; padding-block: 18px 6px; }
.sect > .lbl { font-size: .9rem; color: var(--ink-2); font-weight: 700; letter-spacing: .02em; }
.mainlist { display: flex; flex-direction: column; gap: 12px; }
.mcard { display: grid; grid-template-columns: 56px 1fr 24px; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-align: start; width: 100%; }
.mcard .ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal-deep); }
.mcard.gold .ic { background: var(--gold-soft); color: var(--gold-deep); }
.mcard .ic svg { width: 30px; height: 30px; }
.mcard h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; line-height: 1.3; }
.mcard p { color: var(--ink-2); font-size: .95rem; line-height: 1.5; }
.mcard .chev { color: var(--teal); }
.mcard .chev svg { width: 22px; height: 22px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; text-align: start; }
.tile b { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; line-height: 1.35; }
.tile span { color: var(--ink-2); font-size: .85rem; line-height: 1.45; }
.fatiha { margin-block: 22px 18px; padding: 16px; border-radius: 16px; background: var(--surface-2); text-align: center; color: var(--ink-2); font-size: .95rem; }
.fatiha b { display: block; color: var(--teal-deep); font-family: var(--f-display); font-weight: 600; margin-block: 4px; font-size: 1.02rem; }

.foot { background: var(--teal); color: #fff; border-radius: 26px 26px 0 0; margin-top: 8px; position: relative; }
.foot::before { content: ""; position: absolute; top: -6px; right: 28px; width: 120px; height: 5px; border-radius: 3px; background: var(--gold); }
.foot .in { padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; justify-content: center; font-size: .95rem; }
.foot a, .foot span { color: #fff; }
.foot .ph { direction: ltr; unicode-bidi: embed; font-weight: 700; }

/* ---------- generic content ---------- */
.content { padding-block: 18px 40px; display: flex; flex-direction: column; gap: 16px; }
.crumb { display: inline-flex; align-items: center; gap: 4px; color: var(--teal-deep); font-weight: 700; font-size: .95rem; align-self: flex-start; padding-block: 4px; }
.crumb svg { width: 18px; height: 18px; }
.ttl { font-family: var(--f-display); font-weight: 700; font-size: 1.75rem; line-height: 1.35; color: var(--ink); text-wrap: balance; }
.lead { color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; color: var(--crimson); line-height: 1.4; margin-top: 8px; }
.chip { display: inline-block; padding: 1px 10px; border-radius: 999px; background: var(--teal-soft); color: var(--teal-deep); font-size: .82rem; font-weight: 700; }
.chip.gold { background: var(--gold-soft); color: var(--gold-deep); }

/* dua text */
.dua { font-size: calc(1.4rem * var(--fs)); line-height: 2.25; font-weight: 500; color: var(--ink); }
.dua p + p { margin-top: .5em; }
.dua .rub { font-size: calc(1rem * var(--fs)); line-height: 1.8; color: var(--gold-deep); font-weight: 700; margin-top: .6em; }
.duacard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.duacard > .cap { font-family: var(--f-display); font-weight: 700; color: var(--crimson); font-size: 1.1rem; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.quote { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.quote cite { display: block; font-style: normal; color: var(--teal-deep); font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
.quote p { font-size: calc(1.15rem * var(--fs)); line-height: 2; }
.reward { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 16px; padding: 14px 16px; color: var(--ink); line-height: 1.9; }
.rak { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 16px 10px; }
.rak .cap { font-size: .9rem; color: var(--ink-2); font-weight: 700; padding-top: 8px; }
.rak .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 1.1rem; }
.rak .row:last-child { border-bottom: 0; }
.rak .row span:last-child { color: var(--teal-deep); font-weight: 700; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: flex; gap: 10px; align-items: baseline; }
.steps li b { color: var(--teal-deep); font-family: var(--f-display); min-width: 4.2ch; font-size: .98rem; }
.golink { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--btn); color: var(--btn-ink); font-weight: 700; width: 100%; border: 0; text-align: start; }
.golink svg { width: 20px; height: 20px; flex: none; }

/* rajab list */
.rlist { display: flex; flex-direction: column; gap: 10px; counter-reset: r; }
.ritem { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: start; width: 100%; }
.ritem .t { flex: 1; min-width: 0; }
.ritem b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; line-height: 1.4; }
.ritem small { color: var(--ink-2); font-size: .86rem; line-height: 1.4; }
.ritem svg { width: 20px; height: 20px; color: var(--teal); flex: none; }
.ritem.go { background: var(--teal-soft); border-color: transparent; }
.ritem.go b { color: var(--teal-deep); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.pager a small { color: var(--ink-2); font-size: .8rem; }
.pager a b { font-family: var(--f-display); font-weight: 600; font-size: .98rem; line-height: 1.35; }
.pager a.nx { text-align: start; }

/* dhikr */
.dh { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.dh .tx { font-size: calc(1.1rem * var(--fs)); line-height: 2; }
.dh .meter { display: flex; align-items: center; gap: 12px; }
.dh .bar2 { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.dh .bar2 i { display: block; height: 100%; background: var(--teal); border-radius: 999px; transition: width .2s; }
.dh .n { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; min-width: 5.5ch; text-align: end; color: var(--teal-deep); }
.dh.done .n { color: var(--gold-deep); }
.dh .acts { display: flex; gap: 8px; }
.dh .acts .t { flex: 1; min-height: 52px; border-radius: 14px; border: 0; background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 1.1rem; }
.dh .acts .s { min-height: 52px; padding-inline: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 700; }
.dhrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.dhrow:last-child { border-bottom: 0; }
.dhrow .tx { flex: 1; min-width: 0; font-size: calc(1.05rem * var(--fs)); line-height: 1.9; }
.dhrow .cnt { font-family: var(--f-display); font-weight: 700; color: var(--teal-deep); min-width: 4.4ch; text-align: center; }
.dhrow.done .cnt { color: var(--gold-deep); }
.dhrow button { min-width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--btn); color: var(--btn-ink); font-weight: 800; font-size: 1.2rem; flex: none; }

/* ---------- flow: start ---------- */
.kinds { display: flex; flex-wrap: wrap; gap: 8px; }
.kind { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; color: var(--ink-2); }
.kind[aria-checked="true"] { background: var(--teal-deep); border-color: var(--teal-deep); color: #fff; }
:root[data-theme="dark"] .kind[aria-checked="true"] { color: #0C1B19; background: var(--teal); border-color: var(--teal); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kind[aria-checked="true"] { color: #0C1B19; background: var(--teal); border-color: var(--teal); } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: .92rem; color: var(--ink-2); }
.field input { min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.sample { background: var(--teal-soft); border-radius: 16px; padding: 14px 16px; }
.sample .k { font-size: .85rem; font-weight: 700; color: var(--teal-deep); }
.sample p { font-size: 1.1rem; line-height: 1.9; }
.roadmap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.roadmap li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.roadmap li:last-child { border-bottom: 0; }
.roadmap .no { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal-deep); font-weight: 800; font-size: .95rem; }
.roadmap b { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; display: block; line-height: 1.4; }
.roadmap small { color: var(--ink-2); font-size: .86rem; line-height: 1.45; display: block; }
.roadmap .part { grid-template-columns: 1fr; padding-block: 14px 6px; border-bottom: 0; }
.roadmap .part span { font-family: var(--f-display); font-weight: 700; color: var(--crimson); font-size: 1.15rem; }
.cta { min-height: 56px; width: 100%; border-radius: 16px; border: 0; background: var(--btn); color: var(--btn-ink); font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
.cta.alt { background: var(--surface); color: var(--teal-deep); border: 1px solid var(--line); }
.cta svg { width: 22px; height: 22px; }
.note { font-size: .9rem; color: var(--ink-2); line-height: 1.8; }

/* ---------- flow: step ---------- */
.smeta { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.smeta .part { font-weight: 700; color: var(--crimson); font-size: .95rem; }
.smeta .cnt { color: var(--ink-2); font-size: .9rem; }
.seg { display: flex; gap: 3px; }
.seg i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.seg i.d { background: var(--teal); }
.seg i.c { background: var(--gold); }
.seg i.gap { flex: 0 0 8px; background: transparent; }
.when { display: flex; align-items: baseline; gap: 8px; color: var(--ink-2); }
.nia { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 16px; position: relative; }
.nia .k { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; color: var(--teal-deep); font-size: .92rem; }
.nia p.nt { font-size: calc(1.3rem * var(--fs)); line-height: 2; font-weight: 500; margin-top: 4px; }
.cp { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: .85rem; font-weight: 700; }
.cp svg { width: 16px; height: 16px; }
.learn { color: var(--ink-2); line-height: 1.9; }
.afterbox { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 14px; padding: 12px 14px; font-weight: 700; color: var(--ink); }
.recite { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.recite > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.recite small { color: var(--ink-2); font-weight: 700; display: block; }
.recite b { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; line-height: 1.7; display: block; }
details.dt { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; }
details.dt > summary { list-style: none; cursor: pointer; padding: 14px 0; font-family: var(--f-display); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
details.dt > summary::-webkit-details-marker { display: none; }
details.dt > summary svg { width: 18px; height: 18px; color: var(--teal); transition: transform .2s; }
details.dt[open] > summary svg { transform: rotate(180deg); }
details.dt .body { padding-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
.shad { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.shad li { display: flex; flex-direction: column; gap: 6px; line-height: 1.9; }
.shad li > .dd { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 1.1rem; line-height: 2; }

/* counter */
.ctr { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: var(--shadow); }
.ring { position: relative; width: 168px; height: 168px; }
.ring > svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--surface-2); }
.ring .prg { stroke: var(--teal); transition: stroke-dashoffset .35s; }
.ring.fin .prg { stroke: var(--gold); }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ring .big { font-family: var(--f-display); font-weight: 700; font-size: 3.4rem; color: var(--ink); }
.ring .of { color: var(--ink-2); font-weight: 700; font-size: .95rem; margin-top: 4px; }
.ring .ok { width: 72px; height: 72px; color: var(--gold-deep); stroke-width: 2.2; }
.dots { display: flex; gap: 8px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--line); }
.dots i.d { background: var(--teal); border-color: var(--teal); }
.dots i.c { border-color: var(--gold); background: var(--gold-soft); }
.hint { text-align: center; color: var(--ink-2); font-size: .95rem; line-height: 1.7; min-height: 5.4em; }
.hint b { color: var(--ink); }

فَبِذَلِكَ أَسْأَلُكَ وَبِمَوَاقِعِ الْعِزِّ مِنْ رَحْمَتِكَ وَبِمَقَامَاتِكَ وَعَلَامَاتِكَ أَنْ تُصَلِّيَ عَلَى مُحَمَّدٍ وَآلِهِ وَأَنْ تَزِيدَنِي إِيمَاناً وَتَثْبِيتاً، يَا بَاطِناً فِي ظُهُورِهِ وَظَاهِراً فِي بُطُونِهِ وَمَكْنُونِهِ يَا مُفَرِّقاً بَيْنَ النُّورِ وَالدَّيْجُورِ يَا مَوْصُوفاً بِغَيْرِ كُنْهٍ وَمَعْرُوفاً بِغَيْرِ شِبْهٍ، حَادَّ كُلِّ مَحْدُودٍ وَشَاهِدَ كُلِّ مَشْهُودٍ وَمُوجِدَ كُلِّ مَوْجُودٍ وَمُحْصِيَ كُلِّ مَعْدُودٍ وَفَاقِدَ كُلِّ مَفْقُودٍ لَيْسَ دُونَكَ مِنْ مَعْبُودٍ أَهْلَ الْكِبْرِيَاءِ وَالْجُودِ، يَا مَنْ لَا يُكَيَّفُ بِكَيْفٍ وَلَا يُؤَيَّنُ بِأَيْنٍ يَا مُحْتَجِباً عَنْ كُلِّ عَيْنٍ يَا دَيْمُومُ يَا قَيُّومُ وَعَالِمَ كُلِّ مَعْلُومٍ،

صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ وَعَلَى عِبَادِكَ الْمُنْتَجَبِينَ وَبَشَرِكَ الْمُحْتَجِبِينَ وَمَلَائِكَتِكَ الْمُقَرَّبِينَ وَالْبُهْمِ الصَّافِّينَ الْحَافِّينَ، وَبَارِكْ لَنَا فِي شَهْرِنَا هَذَا الرَّجَبِ الْمُرَجَّبِ الْمُكَرَّمِ وَمَا بَعْدَهُ مِنَ الْأَشْهُرِ الْحُرُمِ وَأَسْبِغْ عَلَيْنَا فِيهِ النِّعَمَ وَأَجْزِلْ لَنَا فِيهِ الْقِسَمَ، وَأَبْرِرْ لَنَا فِيهِ الْقَسَمَ بِاسْمِكَ الْأَعْظَمِ الْأَعْظَمِ الْأَجَلِّ الْأَكْرَمِ الَّذِي وَضَعْتَهُ عَلَى النَّهَارِ فَأَضَاءَ وَعَلَى اللَّيْلِ فَأَظْلَمَ، وَاغْفِرْ لَنَا مَا تَعْلَمُ مِنَّا وَمَا لَا نَعْلَمُ، وَاعْصِمْنَا مِنَ الذُّنُوبِ خَيْرَ الْعِصَمِ وَاكْفِنَا كَوَافِيَ قَدَرِكَ وَامْنُنْ عَلَيْنَا بِحُسْنِ نَظَرِكَ وَلَا تَكِلْنَا إِلَى غَيْرِكَ وَلَا تَمْنَعْنَا مِنْ خَيْرِكَ وَبَارِكْ لَنَا فِيمَا كَتَبْتَهُ لَنَا مِنْ أَعْمَارِنَا وَأَصْلِحْ لَنَا خَبِيئَةَ أَسْرَارِنَا وَأَعْطِنَا مِنْكَ الْأَمَانَ وَاسْتَعْمِلْنَا بِحُسْنِ الْإِيمَانِ وَبَلِّغْنَا شَهْرَ الصِّيَامِ وَمَا بَعْدَهُ مِنَ الْأَيَّامِ وَالْأَعْوَامِ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ.

اللَّهُمَّ إِنِّي أَسْأَلُكَ بِالْمَوْلُودَيْنِ فِي رَجَبٍ مُحَمَّدِ بْنِ عَلِيٍّ الثَّانِي وَابْنِهِ عَلِيِّ بْنِ مُحَمَّدٍ الْمُنْتَجَبِ، وَأَتَقَرَّبُ بِهِمَا إِلَيْكَ خَيْرَ الْقُرَبِ يَا مَنْ إِلَيْهِ الْمَعْرُوفُ طُلِبَ وَفِيمَا لَدَيْهِ رُغِبَ، أَسْأَلُكَ سُؤَالَ مُقْتَرِفٍ مُذْنِبٍ قَدْ أَوْبَقَتْهُ ذُنُوبُهُ وَأَوْثَقَتْهُ عُيُوبُهُ فَطَالَ عَلَى الْخَطَايَا دُؤُوبُهُ وَمِنَ الرَّزَايَا خُطُوبُهُ؛ يَسْأَلُكَ التَّوْبَةَ وَحُسْنَ الْأَوْبَةِ وَالنُّزُوعَ عَنِ الْحَوْبَةِ وَمِنَ النَّارِ فَكَاكَ رَقَبَتِهِ وَالْعَفْوَ عَمَّا فِي رِبْقَتِهِ، فَأَنْتَ مَوْلَايَ أَعْظَمُ أَمَلِهِ وَثِقَتِهِ.

    "x": "بِسْمِ الله الرَّحْمنِ الرَّحِيمِ\nاللّهُمَّ يا مَنْ دَلَعَ لِسانَ الصَّباحِ بِنُطْقِ تَبَلُّجهِ، وَسَرَّحَ قِطَعَ اللَّيْلِ المُظْلِمِ بِغَياهِبِ تَلَجْلُجِهِ، وَأَتْقَنَ صُنْعَ الفَلَكِ الدَّوّارِ فِي مَقادِيرِ تَبَرُّجِهِ، وَشَعْشَعَ ضِياءَ الشَّمْسِ بِنُورِ تَأَجُّجِهِ، يا مَنْ دَلَّ عَلى ذاتِهِ بِذاتِهِ، وَتَنَزَّهَ عَنْ مُجانَسَةِ مَخْلُوقاتِهِ، وَجَلَّ عَنْ مُلائَمَةِ كَيْفِيّاتِهِ.\nيا مَنْ قَرُبَ مِنْ خَطَراتِ الظُّنُونِ، وَبَعُدَ عَنْ لَحَظاتِ العُيُونِ، وَعَلِمَ بِما كانَ قَبْلَ أَنْ يَكُونَ، يا مَنْ أَرْقَدَنِي فِي مِهادِ أَمْنِهِ وَأَمانِهِ، وَأَيْقَضَنِي إِلى ما مَنَحَنِي بِهِ مِنْ مِنَنِهِ وَإِحْسانِهِ، وَكَفَّ أَكُفَّ السُّوءِ عَنِّي بِيَدِهِ وَسُلْطانِهِ، صَلِّ اللّهُمَّ عَلى الدَّلِيلِ إِلَيْكَ فِي اللَّيْلِ الأَلْيَلِ، وَالماسِكِ مِنْ أَسْبابِكَ بِحَبْلِ الشَّرَفِ الأَطْوَلِ، والنَّاصِعِ الحَسَبِ فِي ذِرْوَةِ الكاهِلِ الأَعْبَلِ،\nوَالثَّابِتِ القَدَمِ عَلى زَحالِيفِها فِي الزَّمَنِ الأَوَّلِ وَعَلى آلِهِ الأَخْيارِ المُصْطَفِينَ الأَبْرارِ، وَافْتَحِ اللّهُمَّ لَنا مَصارِيعَ الصَّباحِ بِمَفاتِيحِ الرَّحْمَةِ وَالفَلاحِ، وَأَلْبِسْنِي اللّهُمَّ مِنْ أَفْضَلِ خِلَعِ الهِدايَةِ وَالصَّلاحِ، وَأَغْرِسِ اللّهُمَّ بِعَظَمَتِكَ فِي شِرْبِ جَنانِي يَنابِيعَ الخُشُوعِ، وَأَجْرِ اللّهُمَّ لِهَيْبَتِكَ مِنْ آماقِي زَفَراتِ الدُّمُوعِ، وَأَدِّبِ اللّهُمَّ نَزَقَ الخُرْقِ مِنِّي بِأَزِمَّةِ القُنُوعِ،\nإِلهِي إِنْ لَمْ تَبْتَدِئْنِي الرَّحْمَةُ مِنْكَ بِحُسْنِ التَّوْفِيقِ فَمَنِ السَّالِكُ بِي إِلَيْكَ فِي وَاضِحِ الطَّرِيقِ؟ وَإِنْ أَسْلَمَتْنِي أَناتُكَ لِقائِدِ الامَلِ وَالمُنى فَمَنِ المُقِيلُ عَثَراتِي مِنْ كَبَواةِ الهَوى؟ وَإِنْ خَذَلَنِي نَصْرُكَ عِنْدَ مُحارَبَةِ النَّفْسِ وَالشَّيْطانِ، فَقَدْ وَكَلَنِي خِذْلانُكَ إِلى حَيْثُ النَّصَبِ وَالحِرْمانِ.\nإِلهِي أَتَرانِي ماأَتَيْتُكَ إِلاّ مِنْ حَيْثُ الامالِ، أَمْ عَلِقْتُ بَأَطْرافِ حِبالِكَ إِلاّ حِيْنَ باعَدَتْنِي ذُنُوبِي عَنْ دارِ الوِصالِ، فَبِئْسَ المَطِيَّةُ الَّتِي امْتَطَتُ نَفْسِي مِنْ هَواها، فَواها لَها لِما سَوَّلَتْ لَها ظُنُونُها وَمُناها! وَتَبَّا لَها لِجُرأَتِها عَلى سَيِّدِها وَمَوْلاها!\nإِلهِي قَرَعْتُ بابَ رَحْمَتِكَ بِيَدِ رَجائِي، وَهَرَبْتُ إِلَيْكَ لاجِئاً مِنْ فَرْطِ أَهْوائِي، وَعَلَّقْتُ بِأَطْرافِ حِبالِكَ أَنامِلَ وَلائِي، فَاصْفَحِ اللّهُمَّ عمَّا كُنتُ أَجْرَمْتُهُ مِنْ زَلَلِي وَخَطائِي، وَأَقِلْنِي مِنْ صَرْعَةِ رِدائِي، فإِنَّكَ سَيِّدِي وَمَوْلاي وَمُعْتَمَدِي وَرَجائِي، وَأَنْتَ غايَةُ مَطْلُوبِي، وَمُنايَ فِي مُنْقَلَبِي وَمَثْوايَ.\nإِلهِي كَيْفَ تَطْرُدُ مِسْكِينا إِلْتَجأَ إِلَيْكَ مِنَ الذُّنُوبِ هارِبا؟ أَمْ كَيْفَ تُخَيِّبُ مُسْتَرْشِداً قَصَدَ إِلى جَنابِكَ ساعِيا؟ أَمْ كَيْفَ تَرُدُّ ظَمآنا وَرَدَ إِلى حِياضِكَ شارِبا؟! كَلا، وَحِياضُكَ مُتْرَعَةٌ فِي ضَنْكِ المُحُولِ، وَبابُكَ مَفْتُوحٌ لِلْطَّلَبِ وَالوُغُولِ، وَأَنْتَ غايَةُ المَسؤُولِ ونِهايَةُ المَأْمُولِ!\nإِلهِي هذِهِ أَزِمَّةُ نَفْسِي عَقَلْتُها بِعِقالِ مَشِيَّتِكَ، وَهذِهِ أَعْباء ذُنُوبِي دَرَأْتُها بِعَفْوِكَ وَرَحْمَتِكَ، وَهذِهِ أَهْوائِي المُضِلَّةُ وَكَلْتُها إِلى جَنابِ لُطْفِكَ وَرَأفَتِكَ فَاجْعَلِ اللّهُمَّ صَباحِي هذا نازِلا عَلَيَّ بِضِياءِ الهُدى وَبِالسَّلامَةِ فِي الدِّينِ وَالدُّنْيا، وَمَسائِي جُنَّةً مِنْ كَيْدِ العِدى وَوِقايَةً مِنْ مُرْدِياتِ الهَوى، إِنَّكَ قادِرٌ عَلى ماتَشاءُ تُؤْتِي المُلْكَ مَنْ تَشاءُ، وَتَنْزِعُ المُلْكَ مِمَّنْ تَشاءُ، وَتُعِزُّ مَنْ تَشاءُ وَتُذِلُّ مَنْ تَشاءُ،\nبِيَدِكَ الخَيْرُ إِنَّكَ عَلى كُلِّ شَيْءٍ قَدِيرٌ، تُولِجُ اللَّيلَ فِي النَّهارِ، وَتُولِجُ النَّهارَ فِي اللَّيْلِ، وَتُخْرِجُ الحَيَّ مِنَ المَيِّتِ، وَتُخْرِجُ المَيِّتَ مِنَ الحَيِّ، وَتَرْزُقُ مَنْ تَشاءُ بِغَيْرِ حِسابٍ، لا إِلهَ إِلاّ أَنْتَ، سُبْحانَكَ، اللّهُمَّ وَبِحَمْدِكَ، مَنْ ذا يَعْرِفُ قَدْرَكَ فَلا يَخافُكَ، وَمَنْ ذا يَعْلَمُ ما أَنْتَ فَلا يَهابُكَ.\nأَلَّفْتَ بِقُدْرَتِكَ الفِرَقَ، وَفَلَقْتَ بِلُطْفِكَ الفَلَقَ، وَأَنَرْتَ بِكَرَمِكَ دَياجيَ الغَسَقِ، وَأَنْهَرْتَ المِياهَ مِنَ الصُّمِّ الصَّياخِيدِ عَذْباً وَأُجاجاً، وَأَنْزَلْتَ مِنَ المُعْصِراتِ ماءً ثَجَّاجاً، وَجَعَلْتَ الشَّمْسَ وَالقَمَرَ لِلْبَرِيَّةِ سِراجاً وَهّاجاً، مِنْ غَيْرِ أَنْ تُمارِسَ فِيما ابْتَدَأْتَ بِهِ لُغُوباً وَلا عِلاجاً، فَيا مَنْ تَوَحَّدَ بِالعِزِّ وَالبَقاءِ، وَقَهَرَ عِبادَهُ بِالمَوْتِ وَالفَناءِ، صَلِّ عَلى مُحَمَّدٍ وَآلِهِ الأَتْقِياءِ، وَاسْمَعْ نِدائِي،\nوَاسْتَجِبْ دُعائِي، وَحَقِّقْ بِفَضْلِكَ أَمَلِي وَرَجائِي، يا خَيْرَ مَنْ دُعِيَ لِكَشْفِ الضُّرِ، وَالمَأْمُولِ لِكُلِ عُسْرٍ وَيُسْرٍ، بِكَ أَنْزَلْتُ حاجَتِي فَلا تَرُدَّنِي مِنْ سَنِيِّ مَواهِبِكَ خائِباً، يا كَرِيمُ يا كَرِيمُ يا كَرِيمُ، بِرَحْمَتِكَ يا أرْحَمَ الرّاحِمِينَ، وَصَلَّى الله عَلى خَيْرِ خَلْقِهِ مُحَمَّدٍ وَآلِهِ أَجْمَعِينَ."

    "x": "بِسْمِ اللهِ الرَّحْمنِ الرَّحِيمِ\nاللَّهُمَّ إِنِّي أَسْأَلُكَ بِرَحْمَتِكَ الَّتِي وَسِعَتْ كُلَّ شَيْءٍ وَبِقُوَّتِكَ الَّتِي قَهَرْتَ بِهَا كُلَّ شَيْءٍ وَخَضَعَ لَهَا كُلُّ شَيْءٍ وَذَلَّ لَهَا كُلُّ شَيْءٍ وَبِجَبَرُوتِكَ الَّتِي غَلَبْتَ بِهَا كُلَّ شَيْءٍ\nوَبِعِزَّتِكَ الَّتِي لاَ يَقُومُ لَهَا شَيْءٌ وَبِعَظَمَتِكَ الَّتِي مَلَأَتْ كُلَّ شَيْءٍ وَبِسُلْطَانِكَ الَّذِي عَلاَ كُلَّ شَيْءٍ وَبِوَجْهِكَ الْبَاقِي بَعْدَ فَنَاءِ كُلِّ شَيْءٍ وَبِأَسْمَائِكَ الَّتِي مَلَأَتْ أَرْكَانَ كُلِّ شَيْءٍ\nوَبِعِلْمِكَ الَّذِي أَحَاطَ بِكُلِّ شَيْءٍ وَبِنُورِ وَجْهِكَ الَّذِي أَضَاءَ لَهُ كُلُّ شَيْءٍ يَا نُورُ يَا قُدُّوسُ يَا أَوَّلَ الْأَوَّلِينَ وَيَا آخِرَ الْآخِرِينَ\nاللَّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تَهْتِكُ الْعِصَمَ. اللَّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تُنْزِلُ النِّقَمَ\nاللَّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تُغَيِّرُ النِّعَمَ اللَّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تَحْبِسُ الدُّعَاءَ اللَّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تُنْزِلُ الْبَلأَءَ اللَّهُمَّ اغْفِرْ لِي كُلَّ ذَنْبٍ أَذْنَبْتُهُ\nوَكُلَّ خَطِيئَةٍ أَخْطَأْتُهَا اللَّهُمَّ إِنِّي أَتَقَرَّبُ إِلَيْكَ بِذِكْرِكَ وَأَسْتَشْفِعُ بِكَ إِلَى نَفْسِكَ\nوَأَسْأَلُكَ بِجُودِكَ أَنْ تُدْنِيَنِي مِنْ قُرْبِكَ وَأَنْ تُوزِعَنِي شُكْرَكَ وَأَنْ تُلْهِمَنِي ذِكْرَكَ اللَّهُمَّ إِنِّي أَسْأَلُكَ سُؤَالَ خَاضِعٍ مُتَذَلِّلٍ خَاشِعٍ أَنْ تُسَامِحَنِي وَتَرْحَمَنِي وَتَجْعَلَنِي بِقِسْمِكَ رَاضِياً قَانِعاً وَفِي جَمِيعِ الْأَحْوَالِ مُتَوَاضِعاً.\nاللهم وأسألك سؤال من اشتدّت فاقته، وأنزل بك عند الشدائد حاجته، وعظم فيما عندك رغبته. اللهم عظم سلطانك. وعلا مكانك، وخفي مكرك، وظهر أمرك، وغلب قهرك، وجرت قدرتك، ولا يمكن الفرار من حكومتك.\nاللهم لا أجد لذنوبي غافراًوَ لاَ لِقَبَائِحِي سَاتِراً وَلاَ لِشَيْءٍ مِنْ عَمَلِيَ الْقَبِيحِ بِالْحَسَنِ مُبَدِّلاً غَيْرَكَ لاَ إِلَهَ إِلاَّ أَنْتَ سُبْحَانَكَ وَبِحَمْدِكَ ظَلَمْتُ نَفْسِي وَتَجَرَّأْتُ بِجَهْلِي وَسَكَنْتُ إِلَى قَدِيمِ ذِكْرِكَ لِي وَمَنِّكَ عَلَيَ\nاللَّهُمَّ مَوْلأَيَ كَمْ مِنْ قَبِيحٍ سَتَرْتَهُ وَكَمْ مِنْ فَادِحٍ مِنَ الْبَلأَءِ أَقَلْتَهُ وَكَمْ مِنْ عِثَارٍ وَقَيْتَهُ وَكَمْ مِنْ مَكْرُوهٍ دَفَعْتَهُ وَكَمْ مِنْ ثَنَاءٍ جَمِيلٍ لَسْتُ أَهْلاً لَهُ نَشَرْتَهُ\nاللَّهُمَّ عَظُمَ بَلأَئِي وَأَفْرَطَ بِي سُوءُ حَالِي وَقَصُرَتْ بِي أَعْمَالِي وَقَعَدَتْ بِي أَغْلأَلِي وَحَبَسَنِي عَنْ نَفْعِي بُعْدُ أَمَلِي وَخَدَعَتْنِي الدُّنْيَا بِغُرُورِهَا وَنَفْسِي بِجِنَايَتِهَا وَمِطَالِي\nيَا سَيِّدِي فَأَسْأَلُكَ بِعِزَّتِكَ أَنْ لاَ يَحْجُبَ عَنْكَ دُعَائِي سُوءُ عَمَلِي وَفِعَالِي وَلاَ تَفْضَحْنِي بِخَفِيِّ مَا اطَّلَعْتَ عَلَيْهِ مِنْ سِرِّي وَلاَ تُعَاجِلْنِي بِالْعُقُوبَةِ عَلَى مَا عَمِلْتُهُ فِي خَلَوَاتِي\nمِنْ سُوءِ فِعْلِي وَإِسَاءَتِي وَدَوَامِ تَفْرِيطِي وَجَهَالَتِي وَكَثْرَةِ شَهَوَاتِي وَغَفْلَتِي وَكُنِ اللَّهُمَّ بِعِزَّتِكَ لِي فِي كُلِّ الْأَحْوَالِ رَءُوفاً وَعَلَيَّ فِي جَمِيعِ الْأُمُورِ عَطُوفاً إِلَهِي وَرَبِّي مَنْ لِي غَيْرُكَ أَسْأَلُهُ كَشْفَ ضُرِّي وَالنَّظَرَ فِي أَمْرِي\nإِلَهِي وَمَوْلأَيَ أَجْرَيْتَ عَلَيَّ حُكْماً اتَّبَعْتُ فِيهِ هَوَى نَفْسِي وَلَمْ أَحْتَرِسْ فِيهِ مِنْ تَزْيِينِ عَدُوِّي فَغَرَّنِي بِمَا أَهْوَى وَأَسْعَدَهُ عَلَى ذَلِكَ الْقَضَاءُ فَتَجَاوَزْتُ بِمَا جَرَى عَلَيَّ مِنْ ذَلِكَ بَعْضَ حُدُودِكَ وَخَالَفْتُ بَعْضَ أَوَامِرِكَ\nفَلَكَ الْحُجَّةُ عَلَيَّ فِي جَمِيعِ ذَلِكَ وَلاَ حُجَّةَ لِي فِيمَا جَرَى عَلَيَّ فِيهِ قَضَاؤُكَ وَأَلْزَمَنِي حُكْمُكَ وَبَلأَؤُكَ وَقَدْ أَتَيْتُكَ يَا إِلَهِي بَعْدَ تَقْصِيرِي وَإِسْرَافِي عَلَى\nنَفْسِي مُعْتَذِراً نَادِماً مُنْكَسِراً مُسْتَقِيلاً مُسْتَغْفِراً مُنِيباً مُقِرّاً مُذْعِناً مُعْتَرِفاً لاَ أَجِدُ مَفَرّاً مِمَّا كَانَ مِنِّي وَلاَ مَفْزَعاً أَتَوَجَّهُ إِلَيْهِ فِي أَمْرِي\nغَيْرَ قَبُولِكَ عُذْرِي وَإِدْخَالِكَ إِيَّايَ فِي سَعَةِ مِنْ رَحْمَتِكَ . اللَّهُمَّ فَاقْبَلْ عُذْرِي وَارْحَمْ شِدَّةَ ضُرِّي وَفُكَّنِي مِنْ شَدِّ وَثَاقِي\nيَا رَبِّ ارْحَمْ ضَعْفَ بَدَنِي وَرِقَّةَ جِلْدِي وَدِقَّةَ عَظْمِي يَا مَنْ بَدَأَ خَلْقِي وَذِكْرِي وَتَرْبِيَتِي وَبِرِّي وَتَغْذِيَتِي هَبْنِي لِابْتِدَاءِ كَرَمِكَ وَسَالِفِ بِرِّكَ بِي\nيَا إِلَهِي وَسَيِّدِي وَرَبِّي أَتُرَاكَ مُعَذِّبِي بِنَارِكَ بَعْدَ تَوْحِيدِكَ وَبَعْدَ مَا انْطَوَى عَلَيْهِ قَلْبِي مِنْ مَعْرِفَتِكَ وَلَهِجَ بِهِ لِسَانِي مِنْ ذِكْرِكَ وَاعْتَقَدَهُ ضَمِيرِي مِنْ حُبِّكَ وَبَعْدَ صِدْقِ اعْتِرَافِي وَدُعَائِي خَاضِعاً لِرُبُوبِيَّتِكَ\nهَيْهَاتَ أَنْتَ أَكْرَمُ مِنْ أَنْ تُضَيِّعَ مَنْ رَبَّيْتَهُ أَوْ تُبْعِدَ مَنْ أَدْنَيْتَهُ أَوْ تُشَرِّدَ مَنْ آوَيْتَهُ أَوْ تُسَلِّمَ إِلَى الْبَلأَءِ مَنْ كَفَيْتَهُ وَرَحِمْتَهُ وَلَيْتَ شِعْرِي يَا سَيِّدِي\nوَإِلَهِي وَمَوْلأَيَ أَتُسَلِّطُ النَّارَ عَلَى وُجُوهٍ خَرَّتْ لِعَظَمَتِكَ سَاجِدَةً وَعَلَى أَلْسُنٍ نَطَقَتْ بِتَوْحِيدِكَ صَادِقَةً وَبِشُكْرِكَ مَادِحَةً وَعَلَى قُلُوبٍ اعْتَرَفَتْ بِإِلَهِيَّتِكَ مُحَقِّقَةً\nوَعَلَى ضَمَائِرَ حَوَتْ مِنَ الْعِلْمِ بِكَ حَتَّى صَارَتْ خَاشِعَةً وَعَلَى جَوَارِحَ سَعَتْ إِلَى أَوْطَانِ تَعَبُّدِكَ طَائِعَةً وَأَشَارَتْ بِاسْتِغْفَارِكَ مُذْعِنَةً مَا هَكَذَا الظَّنُّ بِكَ وَلاَ أُخْبِرْنَا بِفَضْلِكَ عَنْكَ يَا كَرِيمُ يَا رَبِ\nوَأَنْتَ تَعْلَمُ ضَعْفِي عَنْ قَلِيلٍ مِنْ بَلأَءِ الدُّنْيَا وَعُقُوبَاتِهَا وَمَا يَجْرِي فِيهَا مِنَ الْمَكَارِهِ عَلَى أَهْلِهَا عَلَى أَنَّ ذَلِكَ بَلأَءٌ وَمَكْرُوهٌ قَلِيلٌ مَكْثُهُ يَسِيرٌ بَقَاؤُهُ قَصِيرٌ مُدَّتُهُ فَكَيْفَ احْتِمَالِي لِبَلأَءِ الْآخِرَةِ\nوَجَلِيلِ وُقُوعِ الْمَكَارِهِ فِيهَا وَهُوَ بَلأَءٌ تَطُولُ مُدَّتُهُ وَيَدُومُ مَقَامُهُ وَلاَ يُخَفَّفُ عَنْ أَهْلِهِ\nلِأَنَّهُ لاَ يَكُونُ إِلاَّ عَنْ غَضَبِكَ وَانْتِقَامِكَ وَسَخَطِكَ وَهَذَا مَا لاَ تَقُومُ لَهُ السَّمَاوَاتُ وَالْأَرْضُ\nيَا سَيِّدِي فَكَيْفَ لِي وَأَنَا عَبْدُكَ الضَّعِيفُ الذَّلِيلُ الْحَقِيرُ الْمِسْكِينُ الْمُسْتَكِينُ يَا إِلَهِي وَرَبِّي وَسَيِّدِي وَمَوْلأَيَ لِأَيِّ الْأُمُورِ إِلَيْكَ أَشْكُو وَلِمَا مِنْهَا أَضِجُّ وَأَبْكِي لِأَلِيمِ الْعَذَابِ وَشِدَِّهِ أَمْ لِطُولِ الْبَلأَءِ وَمُدَّتِهِ\nفَلَئِنْ صَيَّرْتَنِي لِلْعُقُوبَاتِ مَعَ أَعْدَائِكَ وَجَمَعْتَ بَيْنِي وَبَيْنَ أَهْلِ بَلأَئِكَ وَفَرَّقْتَ بَيْنِي وَبَيْنَ أَحِبَّائِكَ وَأَوْلِيَائِكَ فَهَبْنِي يَا إِلَهِي وَسَيِّدِي وَمَوْلأَيَ وَرَبِّي صَبَرْتُ عَلَى عَذَابِكَ فَكَيْفَ أَصْبِرُ عَلَى فِرَاقِكَ\nوَهَبْنِي صَبَرْتُ عَلَى حَرِّ نَارِكَ فَكَيْفَ أَصْبِرُ عَنِ النَّظَرِ إِلَى كَرَامَتِكَ أَمْ كَيْفَ أَسْكُنُ فِي النَّارِ وَرَجَائِي عَفْوُكَ فَبِعِزَّتِكَ يَا سَيِّدِي وَمَوْلأَيَ أُقْسِمُ صَادِقاً لَئِنْ تَرَكْتَنِي نَاطِقاً لَأَضِجَّنَّ إِلَيْكَ بَيْنَ أَهْلِهَا ضَجِيجَ الْآمِلِينَ\nوَلَأَصْرُخَنَّ إِلَيْكَ صُرَاخَ الْمُسْتَصْرِخِينَ\nوَلَأَبْكِيَنَّ عَلَيْكَ بُكَاءَ الْفَاقِدِينَ وَلَأُنَادِيَنَّكَ أَيْنَ كُنْتَ يَا وَلِيَّ الْمُؤْمِنِينَ يَا غَايَةَ آمَالِ الْعَارِفِينَ يَا غِيَاثَ الْمُسْتَغِيثِينَ\nيَا حَبِيبَ قُلُوبِ الصَّادِقِينَ وَيَا إِلَهَ الْعَالَمِينَ أَفَتُرَاكَ سُبْحَانَكَ يَا إِلَهِي وَبِحَمْدِكَ تَسْمَعُ فِيهَا صَوْتَ عَبْدٍ مُسْلِمٍ سُجِنَ فِيهَا بِمُخَالَفَتِهِ وَذَاقَ طَعْمَ عَذَابِهَا بِمَعْصِيَتِهِ وَحُبِسَ بَيْنَ أَطْبَاقِهَا بِجُرْمِهِ وَجَرِيرَتِهِ\nوَهُوَ يَضِجُّ إِلَيْكَ ضَجِيجَ مُؤَمِّلٍ لِرَحْمَتِكَ وَيُنَادِيكَ بِلِسَانِ أَهْلِ تَوْحِيدِكَ وَيَتَوَسَّلُ إِلَيْكَ بِرُبُوبِيَّتِكَ\nيَا مَوْلأَيَ فَكَيْفَ يَبْقَى فِي الْعَذَابِ وَهُوَ يَرْجُو مَا سَلَفَ مِنْ حِلْمِكَ أَمْ كَيْفَ تُؤْلِمُهُ النَّارُ وَهُوَ يَأْمُلُ فَضْلَكَ وَرَحْمَتَكَ أَمْ كَيْفَ يُحْرِقُهُ لَهِيبُهَا وَأَنْتَ تَسْمَعُ صَوْتَهُ وَتَرَى مَكَانَهُ\nأَمْ كَيْفَ يَشْتَمِلُ عَلَيْهِ زَفِيرُهَا وَأَنْتَ تَعْلَمُ ضَعْفَهُ أَمْ كَيْفَ يَتَقَلْقَلُ بَيْنَ أَطْبَاقِهَا وَأَنْتَ تَعْلَمُ صِدْقَهُ أَمْ كَيْفَ تَزْجُرُهُ زَبَانِيَتُهَا وَهُوَ يُنَادِيكَ يَا رَبَّهْ أَمْ كَيْفَ يَرْجُو فَضْلَكَ فِي عِتْقِهِ مِنْهَا فَتَتْرُكُهُ فِيهَا هَيْهَاتَ مَا ذَلِكَ الظَّنُّ بِكَ\nوَلاَ الْمَعْرُوفُ مِنْ فَضْلِكَ\nوَلاَ مُشْبِهٌ لِمَا عَامَلْتَ بِهِ الْمُوَحِّدِينَ مِنْ بِرِّكَ وَإِحْسَانِكَ فَبِالْيَقِينِ أَقْطَعُ لَوْ لاَ مَا حَكَمْتَ بِهِ مِنْ تَعْذِيبِ جَاحِدِيكَ وَقَضَيْتَ بِهِ مِنْ إِخْلأَدِ مُعَانِدِيكَ لَجَعَلْتَ النَّارَ كُلَّهَا بَرْداً\nوَسَلأَماً وَمَا كَانَ لِأَحَدٍ فِيهَا مَقَرّاً وَلاَ مُقَاماً لَكِنَّكَ تَقَدَّسَتْ أَسْمَاؤُكَ أَقْسَمْتَ أَنْ تَمْلَأَهَا مِنَ الْكَافِرِينَ\nمِنَ الْجِنَّةِ وَالنَّاسِ أَجْمَعِينَ وَأَنْ تُخَلِّدَ فِيهَا الْمُعَانِدِينَ وَأَنْتَ جَلَّ ثَنَاؤُكَ قُلْتَ مُبْتَدِئاً وَتَطَوَّلْتَ بِالْإِنْعَامِ مُتَكَرِّماً: أَفَمَنْ كانَ مُؤْمِناً كَمَنْ كانَ فاسِقاً لا يَسْتَوُونَ إِلهِي\nوَسَيِّدِي فَأَسْئَلُكَ بِالْقُدْرَةِ الَّتِي قَدَّرْتَها وَبِالْقَضِيَّةِ الَّتِي حَتَمْتَها وَحَكَمْتَها وَغَلَبْتَ مَنْ عَلَيْهِ أَجْرَيْتَها أَنْ تَهَبَ لِي فِي هذِهِ اللَّيْلَةِ وَفِي هذِهِ السّاعَةِ كُلَّ جُرْمٍ أَجْرَمْتُهُ\nوَكُلَّ ذَنْبٍ أَذْنَبْتُهُ وَكُلَّ قَبِيحٍ أَسْرَرْتُهُ وَكُلَّ جَهْلٍ عَمِلْتُهُ كَتَمْتُهُ أَوْ أَعْلَنْتُهُ أَخْفَيْتُهُ أَوْ أَظْهَرْتُهُ وَكُلَّ سَيِّئَةٍ أَمَرْتَ بِإِثْباتِهَا الْكِرامَ الْكاتِبينَ الَّذينَ\nوَكَّلْتَهُمْ بِحِفْظِ ما يَكُونُ مِنِّي وَجَعَلْتَهُمْ شُهُوداً عَلَىَّ مَعَ جَوارِحِي وَكُنْتَ أَنْتَ الرَّقيبَ عَلَىَّ مِنْ وَراَّئِهِمْ وَالشّاهِدَ لِما خَفِيَ عَنْهُمْ وَبِرَحْمَتِكَ أَخْفَيْتَهُ\nوَبِفَضْلِكَ سَتَرْتَهُ وَأَنْ تُوَفِّرَ حَظِّي مِنْ كُلِّ خَيْرٍ أَنْزَلْتَهُ أَوْ إِحْسانٍ فَضَّلْتَهُ أَوْ بِرٍّ نَشَرْتَهُ أَوْ رِزْقٍ بَسَطْتَهُ أَوْ ذَنْبٍ تَغْفِرُهُ أَوْ خَطَاءٍ تَسْتُرُهُ يا رَبِّ يا رَبِّ يا رَبِّ يا إِلهِي\nوَسَيِّدِي وَمَوْلايَ وَمالِكَ رِقِّي يا مَنْ بِيَدِهِ ناصِيَتِي يا عَليماً بِضُرِّي وَمَسْكَنَتِي يا خَبيراً بِفَقْرِي وَفاقَتِي يا رَبِّ يا رَبِّ يا رَبِّ أَسْئَلُكَ بِحَقِّكَ وَقُدْسِكَ وَأَعْظَمِ صِفاتِكَ\nوَأَسْماَّئِكَ أَنْ تَجْعَلَ أَوْقاتِي مِنَ اللَّيْلِ وَالنَّهارِ بِذِكْرِكَ مَعْمُورَةً وَبِخِدْمَتِكَ مَوْصُولَةً وَأَعْمالِي عِنْدَكَ مَقْبُولَةً حَتّى تَكُونَ أَعْمالِي وَأَوْرادِي كُلُّها وِرْداً\nواحِداً وَحالِي فِي خِدْمَتِكَ سَرْمَداً يا سَيِّدِي يا مَنْ عَلَيْهِ مُعَوَّلِي يا مَنْ إِلَيْهِ شَكَوْتُ أَحْوالِي يا رَبِّ يا رَبِّ يا رَبِّ قَوِّ عَلى خِدْمَتِكَ جَوارِحِي وَاشْدُدْ عَلَى الْعَزيمَةِ جَوانِحِي\nوَهَبْ لِيَ الْجِدَّ فِي خَشْيَتِكَ وَالدَّوامَ فِي الإِتِّصالِ بِخِدْمَتِكَ حَتّى أَسْرَحَ إِلَيْكَ فِي مَيادينِ السّابِقينَ، وَأُسْرِعَ إِلَيْكَ فِي الْبارِزينَ وَأَشْتاقَ إِلى قُرْبِكَ فِي الْمُشْتاقينَ\nوَأَدْنُوَ مِنْكَ دُنُوَّ الْمُخْلِصينَ وَأَخافَكَ مَخافَةَ الْمُوقِنينَ وَأَجْتَمِعَ فِي جِوارِكَ مَعَ الْمُؤْمِنينَ اللّهُمَّ وَمَنْ أَرادَنِي بِسُوَّءٍ فَأَرِدْهُ وَمَنْ كادَنِي فَكِدْهُ وَاجْعَلْنِي مِنْ أَحْسَنِ عَبيدِكَ نَصيباً عِنْدَكَ\nوَأَقْرَبِهِمْ مَنْزِلَةً مِنْكَ وَأَخَصِّهِمْ زُلْفَةً لَدَيْكَ فَإِنَّهُ لا يُنالُ ذلِكَ إِلاّ بِفَضْلِكَ وَجُدْلِي بِجُودِكَ وَاعْطِفْ عَلَىَّ بِمَجْدِكَ وَاحْفَظْنِي بِرَحْمَتِكَ وَاجْعَلْ لِسانِي بِذِكْرِكَ لَهِجاً\nوَقَلْبِي بِحُبِّكَ مُتَيَّماً وَمُنَّ عَلَىَّ بِحُسْنِ إِجابَتِكَ وَأَقِلْنِي عَثْرَتِي وَاغْفِرْ زَلَّتِي فَإِنَّكَ قَضَيْتَ عَلى عِبادِكَ بِعِبادَتِكَ وَأَمَرْتَهُمْ بِدُعاَّئِكَ وَضَمِنْتَ لَهُمُ الإِجابَةَ فَإِلَيْكَ يا رَبِّ نَصَبْتُ\nوَجْهِي وَإِلَيْكَ يا رَبِّ مَدَدْتُ يَدِي فَبِعِزَّتِكَ اسْتَجِبْ لِي دُعائِي وَبَلِّغْنِي مُنايَ وَلا تَقْطَعْ مِنْ فَضْلِكَ رَجائِي وَاكْفِنِي شَرَّ الْجِنِّ وَالإِنْسِ مِنْ أَعْدائِي، يا سَريعَ الرِّضا اِغْفِرْ لِمَنْ لا يَمْلِكُ إِلا الدُّعاَّءَ فَإِنَّكَ فَعّالٌ لِما تَشاَّءُ يا مَنِ اسْمُهُ دَوآءٌ\nوَذِكْرُهُ شِفاَّءٌ وَطاعَتُهُ غِنىً اِرْحَمْ مَنْ رَأسُ مالِهِ الرَّجاَّءُ وَسِلاحُهُ الْبُكاَّءُ يا سابِغَ النِّعَمِ يا دافِعَ النِّقَمِ يا نُورَ الْمُسْتَوْحِشينَ فِي الظُّلَمِ يا عالِماً لا يُعَلَّمُ صَلِّ عَلى مُحَمَّدٍ\nوَآلِ مُحَمَّدٍ وَافْعَلْ بِي ما أَنْتَ أَهْلُهُ وَصَلَّى اللّهُ عَلى رَسُولِهِ وَالأَئِمَّةِ الْمَيامينَ مِنْ الِهِ وَسَلَّمَ تَسْليماً كَثيراً."

ةِ فِي عَمُودِ النّارِ وَفِي طُورِ سَيْنآءَ وَفِي جَبَلِ حُوريثَ فِي الْوادِ الْمُقَدَّسِ فِي الْبُقْعَةِ الْمُبارَكَةِ مِنْ جانِبِ الطُّورِ الأَيْمَنِ مِنَ الشَّجَرَةِ وَفِي أَرْضِ مِصْرَ بِتِسْعِ ايات بَيِّنات،\nوَيَوْمَ فَرَقْتَ لِبَنِي إِسْرآئيلَ الْبَحْرَ وَفِي الْمُنْبَجِساتِ الَّتِي صَنَعْتَ بِهَا الْعَجآئِبَ فِي بَحْرِ سُوف، وَعَقَدْتَ مآءَ الْبَحْرِ فِي قَلْبِ الْغَمْرِ كَالْحِجارَةِ، وَجاوَزْتَ بِبَنِي إِسْرائيلَ الْبَحْرَ وَتَمَّتْ كَلِمَتُكَ الْحُسْنى عَلَيْهِمْ بِما صَبَرُوا وَأَوْرَثْتَهُمْ مَشارِقَ الأَرْضِ وَمَغارِبَهَا الَّتِي بارَكْتَ فيها لِلْعالَمينَ، وَأَغْرَقْتَ فِرْعَوْنَ وَجُنُودَهُ وَمَراكِبَهُ فِي الْيَمِّ،\nوبِاسْمِكَ الْعَظيمِ الأَعْظَمِ الأَعَزِّ الأَجَلِّ الأَكْرَمِ وَبِمَجْدِكَ الَّذِي تَجَلَّيْتَ بِهِ لِمُوسى كَليمِكَ عليه‌السلام فِي طُورِ سَيْناءَ، وَلإِبْراهيمَ عليه‌السلام خَليلِكَ مِنْ قَبْلُ فِي مَسْجِدِ الْخَيْفِ، وَلإِسْحقَ صَفِيِّكَ عليه‌السلام فِي بِئْرِ شِيع وَلِيَعْقُوبَ نَبِيِّكَ عليه‌السلام فِي بَيْتِ ايل، وَأَوْفَيْتَ لإِبْراهيمَ عليه‌السلام بِميثاقِكَ وَلإِسْحقَ بِحَلْفِكَ وَلِيَعْقُوبَ بِشَهادَتِكَ وَلِلْمُؤْمِنينَ بِوَعْدِكَ وَلِلدّاعينَ بِأَسْمائِكَ فَأَجَبْتَ،\nوَبِمَجْدِكَ الَّذِي ظَهَرَ لِمُوسَى بْنِ عِمْرانَ عليه‌السلام عَلى قُبَّةِ الرُّمّانِ وَبِاياتِكَ الَّتِي وَقَعَتْ عَلى أَرْضِ مِصْرَ بِمَجْدِ الْعِزَّةِ وَالْغَلَبَةِ بِايات عَزيزَة وَبِسُلْطانِ الْقُوَّةِ وَبِعِزَّةِ الْقُدْرَةِ وَبِشَأْنِ الْكَلِمَةِ التّآمَّةِ، وَبِكَلِماتِكَ الَّتِي تَفَضَّلْتَ بِها عَلى أَهْلِ السَّماواتِ وَالأَرْضِ وَأَهْلِ الدُّنْيا وَأَهْلِ الآخِرَةِ، وَبِرَحْمَتِكَ الَّتِي مَنَنْتَ بِها عَلى جَميعِ خَلْقِكَ، وَبِاسْتِطاعَتِكَ الَّتِي أَقَمْتَ بِها عَلَى الْعالَمينَ،\nوَبِنُورِكَ الَّذِي قَدْ خَرَّمِنْ فَزَعِهِ طُورُ سَيْنآءَ، وَبِعِلْمِكَ وَجَلالِكَ وَكِبْرِيآئِكَ وَعِزَّتِكَ وَجَبَرُوتِكَ الَّتِي لَمْ تَسْتَقِلَّهَا الأَرْضُ وَانْخَفَضَتْ لَهَا السَّماواتُ وَانْزَجَرَ لَهَا الْعُمْقُ الأَكْبَرُ، وَرَكَدَتْ لَهَا الْبِحارُ وَالأَنْهارُ، وَخَضَعَتْ لَهَا الْجِبالُ وَسَكَنَتْ لَهَا الأَرْضُ بِمَناكِبِها، وَاسْتَسْلَمَتْ لَهَا الْخَلائِقُ كُلُّها، وَخَفَقَتْ لَهَا الرِّياحُ فِي جَرَيانِها، وَخَمَدَتْ لَهَا النّيرانُ فِي أَوْطانِها،\nوَبِسُلْطانِكَ الَّذِي عُرِفَتْ لَكَ بِهِ الْغَلَبَةُ دَهْرَ الدُّهُورِ وَحُمِدْتَ بِهِ فِي السَّماواتِ وَالأَرَضينَ، وَبِكَلِمَتِكَ كَلِمَةِ الصِّدْقِ الَّتِي سَبَقَتْ لاَِبينا ادَمَ عليه‌السلام وَذُرِّيَّتِهِ بِالرَّحْمَةِ وَأَسْأَلُكَ بِكَلِمَتِكَ الَّتِي غَلَبَتْ كُلَّ شَيْء، وَبِنُورِ وَجْهِكَ الَّذِي تَجَلَّيْتَ بِهِ لِلْجَبَلِ فَجَعَلْتَهُ دَكّاً وَخَرَّ مُوسى صَعِقاً، وَبِمَجْدِكَ الَّذِي ظَهَرَ عَلى طُورِ سَيْنآءَ فَكَلَّمْتَ بِهِ عَبْدَكَ وَرَسُولَكَ مُوسَى بْنَ عِمْرانَ،\nوَبِطَلْعَتِكَ فِي ساعيرَ وَظُهُورِكَ فِي جَبَلِ فارانَ بِرَبَواتِ الْمُقَدَّسينَ وَجُنُودِ الْمَلائِكَةِ الصّافّينَ وَخُشُوعِ الْمَلائِكَةِ الْمُسَبِّحينَ، وَبِبَرَكاتِكَ الَّتِي بارَكْتَ فيها عَلى إِبْراهيمَ خَليلِكَ عليه‌السلام فِي أُمَّةِ مُحَمَّد صلى‌الله‌عليه‌وآله، وَبارَكْتَ لإِسْحقَ صَفِيِّكَ فِي أُمَّةِ عيسى عليهما‌السلام، وَبارَكْتَ لِيَعْقُوبَ إِسْرآئيلِكَ فِي أُمَّةِ مُوسى عليهما‌السلام، وَبارَكْتَ لِحَبيبِكَ مُحَمَّد صلى‌الله‌عليه‌وآله فِي عِتْرَتِهِ وَذُرِّيَّتِهِ وَأُمَّتِهِ،\nاللّهُمَّ وَكَما غِبْنا عَنْ ذلِكَ وَلَمْ نَشْهَدْهُ وَآمَنّا بِهِ وَلَمْ نَرَهُ صِدْقاً وَعَدْلاً أَنْ تُصَلِّيَ عَلى مُحَمَّد وَآلِ مُحَمَّد وَأَنْ تُبارِكَ عَلى مُحَمَّد وَآلِ مُحَمَّد وَتَرَحَّمَ عَلى مُحَمَّد وَآلِ مُحَمَّد كَأَفْضَلِ ما صَلَّيْتَ وَبارَكْتَ وَتَرَحَّمْتَ عَلى إِبْراهيمَ وَآلِ إِبْراهيمَ إِنَّكَ حَميدٌ مَجيدٌ فَعّالٌ لِما تُريدُ وَأَنْتَ عَلى كُلِّ شَيْء قَديرٌ."

  "blocks": [

    "x": "اللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِهِ وَبَلِّغْ بِإِيمانِي أَكْمَلَ الإِيمانِ وَاجْعَلْ يَقِينِي أَفْضَلَ اليَقِينِ وَانْتَهِ بِنِيَّتِي إِلى أَحْسَنِ النِّيَّاتِ وَبِعَمَلِي إِلى أَحْسَنِ الأَعْمالِ، اللّهُمَّ وَفِّرْ بِلُطْفِكَ نِيَّتِي وَصَحِّحْ بِما عِنْدَكَ يَقِينِي وَاسْتَصْلِحْ بِقُدْرَتِكَ ما فَسَدَ مِنِّي، اللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِ مُحَمَّدٍ وَاكْفِنِي ما يَشْغَلُنِي الإِهْتمامُ بِهِ وَاسْتَعْمِلْنِي بِما تَسْأَلُنِي غَداً عَنْهُ وَاسْتَفْرِغْ أَيَّامِي فِيما خَلَقْتَنِي لَهُ،\nوَأغْنِنِي وَوَسِّعْ عَلَيَّ فِي رِزْقِكَ وَلا تَفْتِنِّي بِالَّنَظِر وَأَعِزَّنِي وَلا تَبْتَلِيَنِي بِالكِبْرِ وَعَبِّدْنِي لَكَ وَلاتُفْسِدْ عِبادَتِي بِالعُجْبِ وَأَجْرِ لِلْناسِ عَلى يَدَيَّ الخَيْرَ وَلا تَمْحَقْهُ بِالمَنِّ وَهَبْ لِي مَعالِي الأَخْلاقِ وَاعْصِمْنِي مِنَ الفَخْرِ، اللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِهِ وَلا تَرْفَعْنِي فِي النَّاسِ دَرَجَةً إِلاّ حطَطْتَنِي عِنْدَ نَفْسِي مِثْلَها وَلا تُحْدِثْ لِي عِزّاً ظاهِراً إِلاّ أَحْدَثْتَ لِي ذِلَّةً باطِنَةً عِنْدَ نَفْسِي بِقَدَرِها،\nاللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِ مُحَمَّدٍ وَمَتِّعْنِي بِهُدىً صالِحٍ لا اسْتَبْدِلُ بِهِ وَطَرِيقَةِ حَقٍّ لا أَزِيغُ عَنْها وَنِيَّةِ رُشْدٍ لا أَشُكُّ فِيها، وَعَمِّرْنِي ما كانَ عُمْرِي بِذْلَةً فِي طاعَتِكَ فَإِذا كانَ عُمْرِي مَرْتَعاً لِلْشَّيْطانِ فَاقْبِضْنِي إِلَيْكَ قَبْلَ أَنْ يَسْبِقَ مَقْتُكَ إلى أَوْ يَسْتَحْكِمَ غَضَبُكَ عَلَيَّ، اللّهُمَّ لاتَدَعْ خِصْلَةً تُعابُ مِنِّي إِلاّ أَصْلَحْتَها وَلا عائِبَةً أُؤَنَّبُ بِها إِلاّ أَحْسَنْتَها وَلا أُكْرُومَةً فِيَّ ناقِصَةً إِلاّ أَتْمَمْتَها!\nاللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِ مُحَمَّدٍ وَأَبْدِلْنِي مِنْ بُغْضَةِ أَهْلِ الشَّنَآنِ المَحَبَّةَ وَمِنْ حَسَدِ أَهْلَ البَغْيِ المَوَدَّةَ وَمِنْ ظِنَّةِ أَهْلِ الصَّلاحِ الثِّقَةَ وَمِنْ عَداوَةِ الأَدْنَيْنَ الوَلايَةَ وَمِنْ عُقُوقِ ذَوِي الأَرْحامِ المَبَرَّةَ وَمِنْ خِذْلانِ الأَقْرَبِينَ النُّصْرَةَ وَمِنْ حُبِّ المُدارِينَ تَصْحِيحَ المِقَةِ وَمِنْ رَدِّ المُلابِسِينَ كَرَمَ العِشْرَةِ وَمِنْ مَرارَةِ خَوْفِ الظَّالِمِينَ حَلاوَةَ الأَمَنَةِ،\nاللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِهِ وَاجْعَلْ لِي يَداً عَلى مَنْ ظَلَمَنِي وَلِساناً عَلى مَنْ خاصَمَنِي وَظَفَراً بِمَنْ عانَدَنِي، وَهَبْ لِي مَكْراً عَلى مَنْ كايَدَنِي وَقُدْرَةً عَلى مَنْ اضْطَهَدَنِي وَتَكْذِيباً لِمَنْ قَصَبَنِي وَسَلامَةً مِمَّنْ تَوَعَّدَنِي وَوَفِّقْنِي لِطاعَةِ مَنْ سَدَّدَنِي وَمُتابَعَةِ مَنْ أَرْشَدَنِي،\nاللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِهِ وَسَدِّدْنِي لأَنْ أُعارِضَ مَنْ غَشَّنِي بِالنُّصْحِ وَأَجْزِيَ مَنْ هَجَرنِي بِالبِرِّ وَأُثِيبَ مَنْ حَرَمَنِي بِالبَذْلِ وَأُكافِيَ مَنْ قَطَعَنِي بِالصِّلَةِ وَأُخالِفَ مَنْ اغْتابَنِي إِلى حُسْنِ الذِّكْرِ، وَأَنْ أَشْكُرَ الحَسَنَةَ وَأُغْضِي عَنِ السَّيِّئَةِ،\nاللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِهِ وَحَلِّنِي بِحِلْيَةِ الصَّالِحِينَ وَأَلْبِسْنِي زِينَةَ المُتَّقِينَ فِي بَسْطِ العَدْلِ وَكَظْمِ الغَيْظِ وَإِطْفاءِ النَّائِرَةِ وَضَمِّ أَهْلِ الفُرْقَةِ وَإِصْلاحِ ذاتِ البَيْنِ وَإِفْشاءِ العارِفَةِ وَسَتْرِ العائِبَةِ وَلِينِ العَرِيكَةِ وَخَفْضِ الجَّناحِ وَحُسْنِ السِّيرَةِ وَسُكُونِ الرِّيحِ وَطِيبِ المُخالَقَةِ وَالسَّبْقِ إِلى الفَضِيلَةِ وَإِيْثارِ التَّفَضُّلِ وَتَرْكِ التَّعْيِيرِ وَالإِفْضالِ عَلى غَيْرِ المُسْتَحِقِّ وَالقَوْلِ بِالحَقِّ وَإنْ عَزَّ\nوَاسْتِقْلالِ الخَيْرِ وَإِنْ كَثُرَ مِنْ قَوْلِي وَفِعْلِي، وَأَكْمِلْ ذلِكَ لِي بَدَوامِ الطَّاعَةِ وَلِزُومِ الجَّماعَةِ وَرَفْضِ أَهْلِ البِدَعِ وَمُسْتَعْمِلِي الرَّأْيِ المُخْتَرَعِ، اللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِهِ وَاجْعَلْ أَوْسَعَ رِزْقِكَ عَلَيَّ إِذا كَبِرْتُ وَأَقْوى قُوَّتِكَ فِيَّ إِذا نَصِبْتُ، وَلا تَبْتَلِيَنِي بِالكَسَلِ عَنْ عِبادَتِكَ وَلا العَمى عَنْ سَبِيلِكَ وَلا بِالتَّعَرُّضِ لِخِلافِ مَحَبَّتِكَ وَلا مُجامَعَةِ مِنْ تَفَرَّقَ عَنْكَ وَلا مُفارَقَةِ مَنْ اجْتَمَعَ إِلَيْكَ،\nاللّهُمَّ اجْعَلْنِي أَصُولُ بِكَ عِنْدَ الضَّرُورَةِ وَأَسْأَلُكَ عِنْدَ الحاجَةِ وَأَتَضَرَّعُ إِلَيْكَ عِنْدَ المَسْكَنَةِ وَلاتَفْتِنِّي بِالإِسْتِعانَةِ بِغَيْرِكَ إِذا اضْطُرِرْتُ وَلا بِالخُضُوعِ بِسُؤالِ غَيْرِكَ إِذا افْتَقَرْتُ وَلا بِالتَّضَرُّعِ إِلى مَنْ دُونَكَ إِذا رَهِبْتُ، فَأَسْتَحِقَّ بِذلِكَ خِذْلانَكَ وَمَنْعَكَ وَإِعْراضَكَ يا أرْحَمَ الرَّاحِمِينَ.\nاللّهُمَّ اجْعَلْ ما يُلْقِى الشَّيْطانُ فِي رَوْعِي مِنَ التَّمَنِّي وَالتَّظَنِّي وَالحَسَدِ ذِكْراً لِعَظَمَتِكَ وَتَفَكُّراً فِي قُدْرَتِكَ وَتَدْبِيراً عَلى عَدُوِّكَ، وَما أَجْرى عَلى لِسانِي مِنْ لَفْظَةِ فُحْشٍ أَوْ هَجْرٍ أَوْ شَتْمِ عِرْضٍ أَوْ شَهادَةِ باطِلٍ أَوْ اغْتِيابِ مُؤْمِنٍ غائِبٍ أَوْ سَبِّ حاضِرٍ وَما أَشْبَهَ ذلِكَ نُطْقاً بِالحَمْدِ لَكَ وَإِغْراقاً فِي الثَّناءِ عَلَيْكَ وَذَهاباً فِي تَمْجِيدِكَ وَشُكْراً لِنِعْمَتِكَ وَاعْتِرافاً بِإِحْسانِكَ وَإِحْصاءاً لِمِنَنِكَ،\nاللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِهِ وَلا أُظْلَمَنَّ وَأَنْتَ مُطِيقٌ لِلْدَّفْعِ عَنِّي وَلا أَظْلِمَنَّ وَأَنْتَ القادِرُ عَلى القَبْضِ مِنِّي وَلا أَضِلَّنَّ وَقَدْ أَمْكَنَتْكَ هِدايَتِي وَلا أَفْتَقِرَنَّ وَمِنْ عِنْدِك وُسْعِي وَلا أَطْغَيَنَّ وَمِنْ عِنْدِك وُجْدِي، اللّهُمَّ إِلى مَغْفِرَتَكَ وَفَدْتُ وَإِلى عَفْوِكَ قَصَدْتُ وَإِلى تَجاوُزِكَ اشْتَقْتُ وَبِفَضْلِكَ وَثِقْتُ وَلَيْسَ عِنْدِي ما يُوجِبُ لِي مَغْفِرَتِكَ وَلا فِي عَمَلِي ما أَسْتَحِقُّ بِهِ عَفْوَكَ،\nوَمالِي بَعْدَ أَنْ حَكَمْتُ عَلى نَفْسِي إِلاّ فَضْلُكَ فَصَلِّ عَلى مُحَمَّدٍ وَآلِهِ وَتَفَضَّلْ عَلَيَّ، اللّهُمَّ وَانْطِقْنِي بِالهُدى وَأَلهِمْنِي التَّقْوى وَوَفِّقْنِي لِلَّتِي هِيَ أَزْكى وَاسْتَعْمِلْنِي بِما هُوَ أَرْضى، اللّهُمَّ اسْلُكْ بِي الطَّرِيقَةَ المُثْلى وَاجْعَلْنِي عَلى مَلَّتِكَ أَمُوتُ وَأَحْيا،\nاللّهُمَّ صَلِّ عَلى مُحَمَّدٍ وَآلِهِ وَمَتِّعْنِي بِالإِقْتِصادِ وَاجْعَلْنِي مِنْ أَهْلِ السَّدادِ وَمِنْ أَدِلَّةِ الرَّشادِ وَمِنْ صالِحِي العِبادِ وَارْزُقْنِي فَوْزَ المَعادِ وَسَلامَةَ المِرْصادِ، اللّهُمَّ خُذْ لِنَفْسِكَ مِنْ نَفْسِي ما يُخَلِّصُها وَأَبْقِ لِنَفْسِي مِنْ نَفْسِي ما يُصْلِحُها فَإِنَّ نَفْسِي هالِكَةٌ أَوْ تَعْصِمَها."

    const partBanner = (b.parts && st.part > 0 && b.steps[i - 1] && b.steps[i - 1].part !== st.part)
      ? `<div class="afterbox">انتهت أعمال ${esc(b.parts[0])}، وهذه بداية أعمال ${esc(b.parts[st.part])}.</div>` : '';
    const niaHtml = st.nia ? `<section class="nia"><div class="k"><span>النية</span><button class="cp" data-act="copy">${svg('copy')}نسخ</button></div><p class="nt" id="niaTx">${esc(niaFor(id, st.nia))}</p>${st.niaNote ? `<p class="note">${esc(st.niaNote)}</p>` : ''}</section>` : '';
    const learn = (st.learn || []).map(t => `<p class="learn">${esc(t)}</p>`).join('');
    const body = `
      <div class="smeta"><span class="part">${b.parts ? esc(b.parts[st.part]) : esc(F.name)}</span><span class="cnt num">المرحلة ${i + 1} من ${b.steps.length}</span></div>
      ${segHtml(b, f, i)}
      ${partBanner}
      <h1 class="ttl">${esc(st.title)}</h1>
      <div class="when">${esc(st.when)}</div>
      ${niaHtml}${learn}
      ${stepBody(b, f, st)}`;
    const hasCtr = st.type === 'tawaf' || st.type === 'sai' || st.type === 'jamarat';
    const incomplete = hasCtr && !f.done[st.id];
    const nextLabel = nx ? `التالي: ${esc(nx.title)}` : 'إنهاء الأعمال';
    const dock = `<div class="dock"><div class="in">
      <button data-act="prev" ${i === 0 ? 'disabled' : ''} aria-label="المرحلة السابقة">${svg('chevR')}<span>السابق</span></button>
      <button class="nx${incomplete ? ' soft' : ''}" data-act="next" id="nxBtn"><span>${nextLabel}</span>${svg(nx ? 'chevL' : 'check')}</button></div></div>`;
    const tools = `<button class="ibtn" data-act="map" aria-label="خريطة المراحل">${svg('list')}</button>`;
    return { html: page({ title: F.name, body, dock, tools }), after: afterRun };
  }

  /* ----- run: painting ----- */
  let CUR = { v: 'home' }, autoT = null, peek = 0;
  function cur() { const b = built(CUR.id), f = ensureFlow(CUR.id); return { b, f, st: b.steps[clamp(f.i, 0, b.steps.length - 1)] }; }

  function afterRun() {
    const { f, st } = cur();
    if (st.type === 'tawaf' || st.type === 'sai') { paintCounter(); if ((f.ctr[st.id] || 0) >= 7) showFin(false); }
    else if (st.type === 'jamarat') { paintJam(); }
    else if (st.type === 'talbiya') { const t = $('#tcnt'); if (t) t.textContent = f.ctr[st.id] || 0; }
  }
  function paintCounter() {
    const { f, st } = cur(); const n = f.ctr[st.id] || 0, T = 7, sai = st.type === 'sai';
    $('#rPrg').style.strokeDashoffset = CIRC * (1 - n / T);
    $('#ring').classList.toggle('fin', n >= T);
    $('#rMid').innerHTML = n >= T ? svg('check', 'class="ok"') : `<span class="of">أنت في الشوط</span><span class="big ord">${ORD[n]}</span>`;
    $('#rDots').innerHTML = Array.from({ length: T }, (_, k) => `<i class="${k < n ? 'd' : (k === n ? 'c' : '')}"></i>`).join('');
    let hint, label;
    if (n >= T) {
      hint = sai ? '<b>أتممتَ سبعة أشواط</b> وانتهى السعي بالمروة، تقبّل الله.' : '<b>أتممتَ سبعة أشواط</b>، تقبّل الله طوافك.';
      label = 'اكتمل العدّ';
    } else if (sai) {
      const toMarwa = n % 2 === 0;
      hint = `<b>أنت في الشوط ${ORD[n]}</b><br>من ${toMarwa ? 'الصفا إلى المروة' : 'المروة إلى الصفا'}${n === 0 ? ' — ابدأ من الصفا' : ''}${n === 6 ? ' (الشوط الأخير)' : ''}<br><span class="prog">${n === 0 ? 'لم تُتمّ أي شوط بعد' : `أتممتَ ${n} من ${T} أشواط`}</span>`;
      label = `وصلتُ ${toMarwa ? 'المروة' : 'الصفا'} · أتممتُ الشوط ${ORD[n]}`;
    } else {
      hint = `<b>أنت في الشوط ${ORD[n]}</b><br>${n === 0 ? 'ابدأ من الحجر الأسود، واضغط عند عودتك إليه' : (n === 6 ? 'الشوط الأخير، وينتهي بالحجر الأسود' : 'اضغط عند وصولك الحجر الأسود')}<br><span class="prog">${n === 0 ? 'لم تُتمّ أي شوط بعد' : `أتممتَ ${n} من ${T} أشواط`}</span>`;
      label = `أتممتُ الشوط ${ORD[n]}`;
    }
    $('#rHint').innerHTML = hint;
    const tap = $('#rTap'); tap.textContent = label; tap.disabled = n >= T;
    if (n < T) { const fin = $('#rFin'); if (fin) fin.innerHTML = ''; }
    paintDua(st, n);
    if (sai) paintSai(n);
    const nb = $('#nxBtn'); if (nb) nb.classList.toggle('soft', n < T);
  }
  function paintDua(st, n) {
    const arr = st.type === 'sai' ? SAI_DUAS : TAWAF_DUAS;
    const base = Math.min(n, 6), k = clamp(base + peek, 0, 6);
    $('#duaBox').innerHTML = `<div class="peek"><button class="pb" data-act="pk-" ${k === 0 ? 'disabled' : ''}>${svg('chevR')}السابق</button><span class="lbl">${k === base ? 'دعاء شوطك الحالي' : 'استعراض الأدعية'}</span><button class="pb" data-act="pk+" ${k === 6 ? 'disabled' : ''}>التالي${svg('chevL')}</button></div>
      <div class="duacard" style="margin-top:10px"><div class="cap"><span>${esc(arr[k].title)}</span></div><div class="dua">${duaHTML(arr[k].text)}</div></div>`;
  }
  function paintSai(n) {
    const toMarwa = n >= 7 ? true : n % 2 === 0;
    $('#pSafa').classList.toggle('on', !toMarwa); $('#pMarwa').classList.toggle('on', toMarwa);
    $('#saiArrow').innerHTML = svg(toMarwa ? 'chevL' : 'chevR');
    $('#saiCap').textContent = n >= 7 ? 'انتهى السعي بالمروة' : `أنت في الشوط ${ORD[n]}: من ${toMarwa ? 'الصفا إلى المروة' : 'المروة إلى الصفا'}`;
  }
  function showFin(auto) {
    const { b, f, st } = cur(); const nx = b.steps[f.i + 1];
    const canAuto = auto && nx && !st.last;
    const box = $('#rFin') || $('#jfin'); if (!box) return;
    box.innerHTML = `<div class="fin-banner"><b>تمّ ${esc(st.title)}، تقبّل الله</b><span>${nx ? `ننتقل الآن إلى: ${esc(nx.title)}` : 'هذه آخر مرحلة من الأعمال'}</span>${canAuto ? '<div class="cd"><i style="--ms:2800ms"></i></div><button data-act="stay">البقاء هنا</button>' : ''}</div>`;
    clearTimeout(autoT);
    if (canAuto) autoT = setTimeout(() => { if (CUR.v === 'run') goNext(); }, 2800);
  }
  function finishStep() {
    const { f, st } = cur(); f.done[st.id] = true; save(); buzz([30, 50, 30]);
    const nb = $('#nxBtn'); if (nb) nb.classList.remove('soft');
    showFin(true);
  }

  function paintJam() {
    const { f, st } = cur();
    const ns = st.counters.map(c => f.ctr[st.id + ':' + c.key] || 0);
    const firstOpen = st.counters.findIndex((c, k) => ns[k] < c.total);
    $('#jlist').innerHTML = st.counters.map((c, k) => {
      const n = ns[k], done = n >= c.total;
      return `<div class="jc${k === firstOpen ? ' on' : ''}${done ? ' done' : ''}"><div class="top"><b>${esc(c.label)}</b><span class="cn num">${n}/${c.total}</span></div>
        <div class="stones" aria-hidden="true">${Array.from({ length: c.total }, (_, j) => `<i class="${j < n ? 'd' : ''}"></i>`).join('')}</div>
        <div class="mini"><button class="tap" data-act="jtap" data-k="${c.key}" ${done ? 'disabled' : ''}>${done ? 'تمّت' : 'رميتُ حصاة'}</button><button class="u" data-act="jundo" data-k="${c.key}" aria-label="تراجع">${svg('undo', 'width="20" height="20"')}</button></div></div>`;
    }).join('') + '<div id="jfin"></div>';
    const all = firstOpen === -1;
    const nb = $('#nxBtn'); if (nb) nb.classList.toggle('soft', !all);
    if (all) showFin(false);
  }

  function goNext() {
    const { b, f, st } = cur(); clearTimeout(autoT); f.done[st.id] = true;
    if (f.i < b.steps.length - 1) { f.i++; save(); render(); }
    else { save(); location.hash = `#${CUR.id}-done`; }
  }
  function goPrev() { const { f } = cur(); clearTimeout(autoT); if (f.i > 0) { f.i--; save(); render(); } }

  /* ---------------- flow: done ---------------- */
  function viewDone(id) {
    const f = ensureFlow(id), b = built(id);
    f.finished = true; f.started = true; b.steps.forEach(s => { f.done[s.id] = true; }); save();
    const body = `<div class="finish">
      <svg class="seal" viewBox="0 0 96 96" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="18" y="18" width="60" height="60" rx="4"/><rect x="18" y="18" width="60" height="60" rx="4" transform="rotate(45 48 48)"/><path d="M34 49l9 9 19-20" stroke-linecap="round"/></g></svg>
      <h1>تقبّل الله أعمالكم</h1><p>${esc(b.closing)}</p>
      <a class="cta" href="#home">العودة إلى الرئيسية</a>
      <button class="cta alt" data-act="again">إعادة الأعمال من البداية</button></div>`;
    return { html: page({ title: FLOWS[id].name, body }) };
  }

  /* ---------------- rajab ---------------- */
  function viewRajab() {
    const items = RAJAB.map(it => it.go
      ? `<a class="ritem go" href="#${it.go}"><div class="t"><b>${esc(it.title)}</b><small>${esc(it.blurb)}</small></div>${svg('chevL')}</a>`
      : `<a class="ritem" href="#rajab-${it.id}"><div class="t"><b>${esc(it.title)}</b></div>${svg('chevL')}</a>`).join('');
    const body = `${crumb('#home', 'الرئيسية')}<h1 class="ttl">أعمال شهر رجب</h1>
      <p class="lead">من ملف «أعمال شهر رجب - حملة الخلف ١٤٤٧ هـ»: الفضائل والأذكار والصلوات والأدعية.</p><div class="rlist">${items}</div>`;
    return { html: page({ title: 'أعمال شهر رجب', body }) };
  }
  function dhikrBlock(b) {
    const n = S.dhikr[b.id] || 0, pct = Math.min(100, n / b.n * 100);
    return `<div class="dh${n >= b.n ? ' done' : ''}" data-dh="${b.id}" data-n="${b.n}"><div class="tx">${esc(b.x)}</div>
      <div class="meter"><div class="bar2"><i style="width:${pct}%"></i></div><span class="n num">${n}/${b.n}</span></div>
      <div class="acts"><button class="t" data-act="dh" data-by="1">عدّ +1</button>${b.n >= 100 ? '<button class="s" data-act="dh" data-by="10">+10</button>' : ''}<button class="s" data-act="dh" data-by="-1" aria-label="تراجع">−1</button><button class="s" data-act="dhr">إعادة</button></div></div>`;
  }
  function dhikrListBlock(b) {
    return `<div class="card" style="padding:4px 16px">${b.items.map((it, k) => {
      const key = b.id + ':' + k, n = S.dhikr[key] || 0;
      return `<div class="dhrow${n >= it.n ? ' done' : ''}" data-dr="${key}" data-n="${it.n}"><div class="tx">${esc(it.x)}</div><span class="cnt num">${n}/${it.n}</span><button data-act="dr" aria-label="عدّ">+</button></div>`;
    }).join('')}</div>`;
  }
  function blockHtml(b) {
    switch (b.t) {
      case 'quote': return `<div class="quote"><cite>${esc(b.by)}</cite><p>${esc(b.x)}</p></div>`;
      case 'h': return `<h2 class="h3">${esc(b.x)}</h2>`;
      case 'p': return `<p class="bp">${esc(b.x)}</p>`;
      case 'dua': return `<div class="duacard"><div class="dua">${duaHTML(b.x)}</div></div>`;
      case 'reward': return `<div class="reward">${esc(b.x)}</div>`;
      case 'rak': return `<div class="rak">${b.title ? `<div class="cap">${esc(b.title)}</div>` : ''}${b.items.map(r => `<div class="row"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('')}</div>`;
      case 'steps': return `<ul class="steps">${b.items.map((x, i) => `<li><b>${b.labels ? esc(b.labels[i]) : '•'}</b><span>${esc(x)}</span></li>`).join('')}</ul>`;
      case 'go': return `<a class="golink" href="#${b.to}"><span>${esc(b.label)}</span>${svg('chevL')}</a>`;
      case 'dhikr': return dhikrBlock(b);
      case 'dhikrlist': return dhikrListBlock(b);
      default: return '';
    }
  }
  function viewRajabItem(id) {
    const it = RAJAB.find(x => x.id === id && x.blocks);
    if (!it) return viewRajab();
    const list = RAJAB.filter(x => x.blocks), k = list.indexOf(it);
    const pv = list[k - 1], nx = list[k + 1];
    const pager = `<div class="pager">${pv ? `<a href="#rajab-${pv.id}"><small>السابق</small><b>${esc(pv.title)}</b></a>` : '<span></span>'}${nx ? `<a class="nx" href="#rajab-${nx.id}"><small>التالي</small><b>${esc(nx.title)}</b></a>` : '<span></span>'}</div>`;
    const body = `${crumb('#rajab', 'أعمال شهر رجب')}<h1 class="ttl">${esc(it.title)}</h1>${it.blocks.map(blockHtml).join('')}${pager}`;
    return { html: page({ title: 'أعمال شهر رجب', body }) };
  }

  /* ---------------- مكتبة الأدعية والتعقيبات (مفاتيح الجنان) ---------------- */
  const DAY_IDS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  function viewDuaList() {
    const today = 'day-' + DAY_IDS[new Date().getDay()];
    const sec = DUAS_GROUPS.map(g => `<div class="h3">${esc(g.title)}</div><div class="rlist">${DUAS.filter(d => d.group === g.id).map(d =>
      `<a class="ritem${d.id === today ? ' today' : ''}" href="#dua-${d.id}"><div class="t"><b>${esc(d.title)}</b>${d.id === today ? '<small class="tg">دعاء اليوم</small>' : (d.sub ? `<small>${esc(d.sub)}</small>` : '')}</div>${svg('chevL')}</a>`).join('')}</div>`).join('');
    const body = `${crumb('#home', 'الرئيسية')}<h1 class="ttl">الأدعية والتعقيبات</h1>
      <p class="lead">من كتاب «مفاتيح الجنان» للشيخ عباس القمي (رحمه الله): التعقيبات بعد الصلوات، وأدعية أيام الأسبوع، والأدعية المشهورة.</p>${sec}`;
    return { html: page({ title: 'الأدعية والتعقيبات', body }) };
  }
  function viewDuaItem(id) {
    const k = DUAS.findIndex(x => x.id === id);
    if (k < 0) return viewDuaList();
    const it = DUAS[k], pv = DUAS[k - 1], nx = DUAS[k + 1];
    const pager = `<div class="pager">${pv ? `<a href="#dua-${pv.id}"><small>السابق</small><b>${esc(pv.title)}</b></a>` : '<span></span>'}${nx ? `<a class="nx" href="#dua-${nx.id}"><small>التالي</small><b>${esc(nx.title)}</b></a>` : '<span></span>'}</div>`;
    const g = DUAS_GROUPS.find(x => x.id === it.group);
    const body = `${crumb('#duas', 'الأدعية والتعقيبات')}<h1 class="ttl">${esc(it.title)}</h1>${it.sub ? `<p class="lead">${esc(it.sub)}</p>` : ''}${it.blocks.map(blockHtml).join('')}
      <p class="srcnote">المصدر: مفاتيح الجنان${g ? ' — ' + esc(g.title) : ''}</p>${pager}`;
    return { html: page({ title: 'الأدعية والتعقيبات', body }) };
  }

  /* ---------------- duas / adab / contact ---------------- */
  function viewDuas(which) {
    const tawaf = which === 'duas-tawaf', arr = tawaf ? TAWAF_DUAS : SAI_DUAS;
    const body = `${crumb('#home', 'الرئيسية')}<h1 class="ttl">${tawaf ? 'أدعية الطواف' : 'أدعية السعي'}</h1>
      <p class="lead">${tawaf ? 'من ملف «أدعية الطواف والسعي - حملة الخلف».' : 'أدعية أشواط السعي السبعة بين الصفا والمروة.'}</p>
      ${arr.map(d => `<div class="duacard"><div class="cap"><span>${esc(d.title)}</span></div><div class="dua">${duaHTML(d.text)}</div></div>`).join('')}
      ${tawaf ? shadHtml() : ''}`;
    return { html: page({ title: tawaf ? 'أدعية الطواف' : 'أدعية السعي', body }) };
  }
  function viewAdab() {
    const body = `${crumb('#home', 'الرئيسية')}<h1 class="ttl">آداب العمرة وفضلها</h1>
      <div class="h3" style="margin:0">فضل العمرة</div>
      ${FADL_UMRA.map(t => `<div class="quote"><p>${esc(t)}</p></div>`).join('')}
      <div class="h3">التلبية</div>
      <div class="duacard"><div class="dua"><p>${esc(TALBIYA)}</p></div></div>
      ${shadHtml().replace('<details class="dt">', '<details class="dt" open>')}`;
    return { html: page({ title: 'آداب العمرة', body }) };
  }
  function viewContact() {
    const rows = PHONES.map(p => `<div class="crow"><div class="t"><b>${esc(p.n)}</b><div class="ph num">${p.p}</div></div><button class="cp" data-act="cp-num" data-p="${p.p}">${svg('copy')}نسخ</button></div>`).join('');
    const body = `${crumb('#home', 'الرئيسية')}<h1 class="ttl">تواصل مع الحملة</h1>
      <p class="lead">حملة الخلف للحج والعمرة.</p>
      <div class="contact">${rows}
        <div class="crow"><div class="t"><b>فيسبوك · إنستغرام · سناب شات · يوتيوب</b><div class="ph" style="font-size:1.05rem">${HANDLE}</div></div></div></div>
      <div class="h3">في الإصدارات القادمة</div>
      <div class="soon"><span class="chip gold">الاستماع إلى الأدعية</span><span class="chip gold">الأحكام والمسائل</span><span class="chip gold">التواصل المباشر مع الحملة</span><span class="chip gold">المزيد من الأفكار</span></div>`;
    return { html: page({ title: 'تواصل مع الحملة', body }) };
  }

  /* ---------------- map sheet ---------------- */
  function openMap() {
    const { b, f } = cur();
    let h = '', last = -1;
    b.steps.forEach((s, k) => {
      if (b.parts && s.part !== last) { last = s.part; h += `<div class="pt">${esc(b.parts[s.part])}</div>`; }
      const d = f.done[s.id], c = k === f.i;
      h += `<button class="mapit${d ? ' d' : ''}${c ? ' cur' : ''}" data-act="goto" data-i="${k}"><span class="no num">${d && !c ? svg('check') : k + 1}</span><div><b>${esc(s.title)}</b><small>${esc(s.when)}</small></div></button>`;
    });
    const back = document.createElement('div'); back.className = 'sheet-back'; back.id = 'sheetBack';
    back.innerHTML = `<div class="sheet" role="dialog" aria-label="مراحل الأعمال"><div class="hd"><b>مراحل ${esc(FLOWS[CUR.id].name)}</b><button class="ibtn" data-act="closemap" aria-label="إغلاق">${svg('x')}</button></div>${h}</div>`;
    back.addEventListener('click', e => { if (e.target === back) closeMap(); });
    document.body.appendChild(back);
    const c = back.querySelector('.mapit.cur'); if (c) c.scrollIntoView({ block: 'center' });
  }
  function closeMap() { const b = $('#sheetBack'); if (b) b.remove(); }

  /* ---------------- settings sheet ---------------- */
  /* Choices are staged in a draft (D) and only applied/saved when the pilgrim taps «موافق». */
  const PKEYS = ['fs', 'wt', 'font', 'theme'];
  let D = null;
  const dirty = () => !!D && PKEYS.some(k => String(D[k]) !== String(S[k]));
  function segSet(k, cur, opts) {
    return `<div class="kinds" role="radiogroup">${opts.map(o => `<button class="kind" role="radio" aria-checked="${String(cur) === String(o[0])}" data-act="set" data-k="${k}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`;
  }
  function settingsBody() {
    const d = dirty();
    return `<div class="duacard" id="setPrev" style="margin-block:4px 6px"><div class="cap"><span>معاينة</span></div><div class="dua"><p>اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِ مُحَمَّدٍ، وَاغْفِرْ لِي وَارْحَمْنِي</p></div></div>
      <div class="setrow"><div class="lb">حجم الخط</div>${segSet('fs', D.fs, [[0, 'عادي'], [1, 'كبير'], [2, 'أكبر']])}</div>
      <div class="setrow"><div class="lb">سمك خط الأدعية</div>${segSet('wt', D.wt, [['n', 'عادي'], ['b', 'عريض']])}</div>
      <div class="setrow"><div class="lb">نوع خط النسخ</div>${segSet('font', D.font, Object.keys(FONTS).map(k => [k, FONTS[k].label]))}</div>
      <div class="setrow"><div class="lb">المظهر</div>${segSet('theme', D.theme, [['auto', 'تلقائي'], ['light', 'فاتح'], ['dark', 'داكن']])}</div>
      <div class="setfoot">
        <div class="sethint${d ? ' on' : ''}" role="status">${d ? 'اخترتَ تغييرات لم تُطبَّق بعد — اضغط «موافق» لتطبيقها.' : 'اختر ما تريد ثم اضغط «موافق» لتطبيقه.'}</div>
        <div class="setbtns"><button class="cta" data-act="setok">${svg('check')}موافق</button><button class="cta alt" data-act="closeset">إلغاء</button></div>
      </div>`;
  }
  function paintPrev() {
    const c = $('#setPrev'); if (!c || !D) return;
    const f = FONTS[D.font] || FONTS.amiri; ensureFont(D.font in FONTS ? D.font : 'amiri');
    c.style.setProperty('--fs', FS_LEVELS[D.fs] || 1);
    c.style.setProperty('--f-naskh', f.stack);
    c.style.setProperty('--duaw', D.wt === 'b' ? 700 : 400);
  }
  function openSettings() {
    closeSettings();
    D = {}; PKEYS.forEach(k => { D[k] = S[k]; });
    const back = document.createElement('div'); back.className = 'sheet-back'; back.id = 'setBack';
    back.innerHTML = `<div class="sheet" role="dialog" aria-label="إعدادات العرض"><div class="hd"><b>إعدادات العرض</b><button class="ibtn" data-act="closeset" aria-label="إغلاق دون تطبيق">${svg('x')}</button></div><div id="setBody">${settingsBody()}</div></div>`;
    back.addEventListener('click', e => { if (e.target === back) closeSettings(); });
    document.body.appendChild(back);
    paintPrev();
  }
  function paintSettings() { const b = $('#setBody'); if (b) { b.innerHTML = settingsBody(); paintPrev(); } }
  function closeSettings() { const b = $('#setBack'); if (b) b.remove(); D = null; }

  /* ---------------- router ---------------- */
  function parseRoute() {
    let h = ''; try { h = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { h = ''; }
    let m;
    if (h === 'umra' || h === 'hajj') return { v: 'start', id: h };
    if ((m = h.match(/^(umra|hajj)-run$/))) return { v: 'run', id: m[1] };
    if ((m = h.match(/^(umra|hajj)-done$/))) return { v: 'done', id: m[1] };
    if (h === 'duas') return { v: 'dualist' };
    if ((m = h.match(/^dua-(.+)$/))) return { v: 'dua-item', id: m[1] };
    if (h === 'rajab') return { v: 'rajab' };
    if ((m = h.match(/^rajab-(.+)$/))) return { v: 'rajab-item', id: m[1] };
    if (h === 'duas-tawaf' || h === 'duas-sai') return { v: 'duas', id: h };
    if (h === 'adab') return { v: 'adab' };
    if (h === 'contact') return { v: 'contact' };
    return { v: 'home' };
  }
  function render() {
    clearTimeout(autoT); peek = 0; closeMap(); closeSettings();
    CUR = parseRoute();
    let out;
    switch (CUR.v) {
      case 'start': out = viewStart(CUR.id); break;
      case 'run': out = viewRun(CUR.id); break;
      case 'done': out = viewDone(CUR.id); break;
      case 'dualist': out = viewDuaList(); break;
      case 'dua-item': out = viewDuaItem(CUR.id); break;
      case 'rajab': out = viewRajab(); break;
      case 'rajab-item': out = viewRajabItem(CUR.id); break;
      case 'duas': out = viewDuas(CUR.id); break;
      case 'adab': out = viewAdab(); break;
      case 'contact': out = viewContact(); break;
      default: out = viewHome();
    }
    $('#app').innerHTML = out.html;
    window.scrollTo(0, 0);
    if (out.after) out.after();
    keepAwake(CUR.v === 'run');
  }

  /* ---------------- actions ---------------- */
  const ACTS = {
    settings() { openSettings(); },
    closeset() { closeSettings(); },
    set(el) {
      if (!D) return;
      const k = el.dataset.k, v = el.dataset.v;
      if (k === 'fs') D.fs = +v; else if (PKEYS.includes(k)) D[k] = v;
      paintSettings();
    },
    setok() {
      if (!D) return;
      const ch = dirty();
      if (ch) { PKEYS.forEach(k => { S[k] = D[k]; }); save(); applyPrefs(); }
      closeSettings();
      if (ch) toast('تم تطبيق إعدادات العرض');
    },
    copy(el) { const n = $('#niaTx'); if (n) copyText(n.textContent, n); },
    'cp-num'(el) { copyText(el.dataset.p, el.parentNode.querySelector('.ph')); },
    kind(el) { const f = ensureFlow(CUR.id); f.kind = el.dataset.id; save(); keepScroll(render); },
    start() { const f = ensureFlow(CUR.id); if (!(f.started && !f.finished)) { f.i = 0; f.finished = false; } f.started = true; save(); location.hash = `#${CUR.id}-run`; },
    restart(el) { confirmTap(el, 'اضغط مرة أخرى للتأكيد', () => { const f = ensureFlow(CUR.id); Object.assign(f, { i: 0, started: false, finished: false, done: {}, ctr: {} }); save(); render(); }); },
    again() { const id = CUR.id, f = ensureFlow(id); Object.assign(f, { i: 0, started: true, finished: false, done: {}, ctr: {} }); save(); location.hash = `#${id}-run`; },
    next() { goNext(); },
    prev() { goPrev(); },
    stay() { clearTimeout(autoT); const b = document.querySelector('.fin-banner'); if (b) { const cd = b.querySelector('.cd'); if (cd) cd.remove(); el_remove(b.querySelector('[data-act="stay"]')); } },
    map() { openMap(); },
    closemap() { closeMap(); },
    goto(el) { const { f } = cur(); f.i = +el.dataset.i; save(); closeMap(); render(); },
    tap() {
      const { f, st } = cur(); const n = f.ctr[st.id] || 0; if (n >= 7) return;
      f.ctr[st.id] = n + 1; peek = 0; save(); buzz(14); paintCounter();
      if (n + 1 >= 7) finishStep();
    },
    undo() {
      const { f, st } = cur(); const n = f.ctr[st.id] || 0; if (n <= 0) return;
      clearTimeout(autoT); f.ctr[st.id] = n - 1; delete f.done[st.id]; peek = 0; save(); paintCounter();
    },
    reset(el) { confirmTap(el, 'اضغط للتأكيد', () => { const { f, st } = cur(); clearTimeout(autoT); f.ctr[st.id] = 0; delete f.done[st.id]; peek = 0; save(); paintCounter(); }); },
    'pk-'() { const { f, st } = cur(); peek--; paintDua(st, f.ctr[st.id] || 0); },
    'pk+'() { const { f, st } = cur(); peek++; paintDua(st, f.ctr[st.id] || 0); },
    jtap(el) {
      const { f, st } = cur(); const c = st.counters.find(x => x.key === el.dataset.k), key = st.id + ':' + c.key;
      const n = f.ctr[key] || 0; if (n >= c.total) return; f.ctr[key] = n + 1; save(); buzz(14); paintJam();
      if (st.counters.every(x => (f.ctr[st.id + ':' + x.key] || 0) >= x.total)) finishStep();
    },
    jundo(el) {
      const { f, st } = cur(); const key = st.id + ':' + el.dataset.k; const n = f.ctr[key] || 0; if (n <= 0) return;
      clearTimeout(autoT); f.ctr[key] = n - 1; delete f.done[st.id]; save(); paintJam();
    },
    jnew(el) { confirmTap(el, 'اضغط مرة أخرى للتأكيد', () => { const { f, st } = cur(); clearTimeout(autoT); st.counters.forEach(c => { f.ctr[st.id + ':' + c.key] = 0; }); delete f.done[st.id]; save(); paintJam(); const fin = $('#jfin'); if (fin) fin.innerHTML = ''; }); },
    tl() { const { f, st } = cur(); f.ctr[st.id] = (f.ctr[st.id] || 0) + 1; save(); buzz(10); $('#tcnt').textContent = f.ctr[st.id]; },
    tlu() { const { f, st } = cur(); f.ctr[st.id] = Math.max(0, (f.ctr[st.id] || 0) - 1); save(); $('#tcnt').textContent = f.ctr[st.id]; },
    dh(el) {
      const box = el.closest('[data-dh]'), id = box.dataset.dh, T = +box.dataset.n;
      S.dhikr[id] = clamp((S.dhikr[id] || 0) + (+el.dataset.by), 0, T); save(); buzz(10); paintDh(box, S.dhikr[id], T);
    },
    dhr(el) { confirmTap(el, 'تأكيد؟', () => { const box = el.closest('[data-dh]'); S.dhikr[box.dataset.dh] = 0; save(); paintDh(box, 0, +box.dataset.n); }); },
    dr(el) {
      const row = el.closest('[data-dr]'), key = row.dataset.dr, T = +row.dataset.n;
      S.dhikr[key] = Math.min(T, (S.dhikr[key] || 0) + 1); save(); buzz(10);
      row.querySelector('.cnt').textContent = S.dhikr[key] + '/' + T; row.classList.toggle('done', S.dhikr[key] >= T);
    },
  };
  function el_remove(n) { if (n) n.remove(); }
  function paintDh(box, n, T) {
    box.querySelector('.bar2 i').style.width = Math.min(100, n / T * 100) + '%';
    box.querySelector('.n').textContent = n + '/' + T; box.classList.toggle('done', n >= T);
  }
  function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

  let lastFire = 0;
  const fire = (el, e) => { if (!el || el.disabled) return; const fn = ACTS[el.dataset.act]; if (fn) fn(el, e); };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && el.closest('.dock') && Date.now() - lastFire < 700) return;   // already handled on touch release
    fire(el, e);
  });
  /* الشريط السفلي: بعض المتصفحات على الجوال تبتلع أول نقرة بعد التمرير أو تغيّر حجم الشاشة،
     فننفّذ الأمر عند رفع الإصبع مباشرةً (ونتجاهل النقرة المكرّرة اللاحقة). */
  let pd = null;
  document.addEventListener('pointerdown', e => {
    pd = (e.pointerType === 'touch' && e.target.closest) ? { el: e.target.closest('.dock [data-act]'), x: e.clientX, y: e.clientY } : null;
  }, { passive: true });
  document.addEventListener('pointerup', e => {
    if (!pd || !pd.el || e.pointerType !== 'touch') return;
    const el = e.target.closest ? e.target.closest('.dock [data-act]') : null;
    if (el === pd.el && Math.abs(e.clientX - pd.x) < 12 && Math.abs(e.clientY - pd.y) < 12) { lastFire = Date.now(); fire(el, e); }
    pd = null;
  }, { passive: true });
  document.addEventListener('pointercancel', () => { pd = null; }, { passive: true });
  document.addEventListener('input', e => {
    if (e.target.dataset && e.target.dataset.in === 'name' && CUR.v === 'start') {
      ensureFlow(CUR.id).name = e.target.value; save();
      const s = $('#sample'); if (s) s.innerHTML = sampleHtml(CUR.id);
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMap(); closeSettings(); } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(CUR.v === 'run'); });
  window.addEventListener('hashchange', render);

  applyPrefs();
  render();
})();

</script>

</body></html>
